name: CI

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OTP_VERSION: "29"
  ELIXIR_VERSION: "1.20.4"

permissions:
  contents: read

# ── Architecture ────────────────────────────────────────────────────────────
#
# A lightweight CI gate that runs on every pull request and push to main.
# Four jobs: tests, formatting, compile warnings and shell-script syntax. The
# `test` job is a matrix over the two umbrella apps so their suites run in
# parallel on separate runners (the umbrella `mix test` would run them
# sequentially).
#
# The NIF dependencies (xqlite, html5ever, lazy_html) use precompiled
# binaries (rustler_precompiled / cc_precompiler), so no Rust or C/C++
# toolchain is required on the runner.

jobs:
  test:
    name: Tests (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [evo_git, evo_dash]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Cache mix deps
        uses: actions/cache@v4
        with:
          path: deps
          key: mix-deps-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-deps-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - name: Cache mix build
        uses: actions/cache@v4
        with:
          path: _build
          key: mix-build-test-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-build-test-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile

      - name: Run tests
        # `mix test` must run from inside the app directory — running it from
        # the umbrella root with an app path argument silently runs no tests.
        working-directory: apps/${{ matrix.app }}
        run: mix test

  format-check:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Cache mix deps
        uses: actions/cache@v4
        with:
          path: deps
          key: mix-deps-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-deps-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile dependencies
        # The evo_dash formatter uses plugins from deps (e.g.
      # Phoenix.LiveView.HTMLFormatter), so dependencies must be compiled
      # before format checking.
        run: mix deps.compile

      - name: Check formatting
        run: mix format --check-formatted

  compile-warnings:
    name: Compile warnings
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Cache mix deps
        uses: actions/cache@v4
        with:
          path: deps
          key: mix-deps-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-deps-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - name: Cache mix build
        uses: actions/cache@v4
        with:
          path: _build
          key: mix-build-test-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-build-test-${{ runner.os }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile with warnings as errors
        run: MIX_ENV=test mix compile --warnings-as-errors

  shell-lint:
    name: Shell script syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check shell script syntax
        # `bash -n` parses without executing — no shellcheck dependency. Covers
        # the release installer (scripts/install.sh) plus any other repo shell
        # script, and is a no-op while scripts/ has no .sh file.
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(scripts/*.sh)
          if [[ "${#files[@]}" -eq 0 ]]; then
            echo "no scripts/*.sh found — nothing to check"
            exit 0
          fi
          for f in "${files[@]}"; do
            echo "bash -n ${f}"
            bash -n "${f}"
          done
