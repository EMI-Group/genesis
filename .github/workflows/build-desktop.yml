name: Build Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      target:
        description: "Platform to build"
        required: true
        default: macos-arm64
        type: choice
        options:
          - macos-arm64
          - linux-x64
          - linux-arm64
          - windows-x64
          - all
      publish_release:
        description: "Upload artifacts to a GitHub Release"
        required: true
        default: false
        type: boolean
      tag:
        description: "Release tag (required when publish_release is true), e.g. v0.1.0"
        required: false
        type: string

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref }}-
    ${{ inputs.target || 'release' }}-
    ${{ inputs.tag || (github.event_name == 'push' && github.ref_name) || 'build' }}
  cancel-in-progress: true

env:
  ELIXIR_VERSION: "1.20.3"
  OTP_VERSION: "29"
  RUST_VERSION: "1.97.1"
  TAURI_CLI_VERSION: "2.11.4"
  RIPGREP_VERSION: "15.1.0"
  MINGIT_VERSION: "2.54.0.windows.1"

permissions:
  contents: read

# ── Architecture ────────────────────────────────────────────────────────────
#
# Native builds only (mix release --include_erts + Tauri on the host runner).
# Desktop jobs stage installers under dist/; the dedicated build-linux-remote
# job (Linux) plus the macOS/Windows jobs also build genesis_remote tarballs.
#
# Jobs:
#   prepare             publish flag, release tag, linux matrix JSON
#   build-linux         ubuntu-24.04 (+ arm) — matrix: deb, rpm, [AppImage, tarball]
#   build-linux-remote  ubuntu-22.04 (+ arm) — dedicated genesis_remote glibc build (default)
#   build-macos-arm64   macos-15 — dmg, app.zip, app.tar.gz updater payload (notarized; all staged desktop artifacts minisign-signed)
#   build-windows-x64   windows-2022 — msi, exe (NSIS)
#   publish-release     single writer for GitHub Release assets
#
# Shared steps: .github/actions/setup-mix, .github/actions/install-tauri-cli
#
# macOS secrets: APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
# APPLE_SIGNING_IDENTITY, APPLE_API_ISSUER, APPLE_API_KEY, APPLE_API_KEY_P8_BASE64
# Minisign (all desktop jobs): TAURI_SIGNING_PRIVATE_KEY,
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD — when present, every staged desktop
# distribution artifact in dist/ is minisign-signed (<artifact>.sig) and updater
# payloads are auto-emitted; when absent, signing is skipped with a warning and
# updater artifacts are disabled via --config. genesis_remote_* tarballs are
# deliberately never signed (EvoGit.RemoteBootstrap does no signature check).
# Nested ERTS/NIFs: desktop/scripts/sign-macos-nested.sh
#
# Artifact names: genesis_{desktop|remote}_{platform}_{arch}.{format}
# (unversioned — permanent releases/latest/download/ links; the version comes
# from the release tag and is baked into the app at build time, not the filename)
#
# genesis_remote Linux naming: glibc is now the DEFAULT with NO suffix —
# genesis_remote_linux_x64.tar.xz and genesis_remote_linux_arm64.tar.xz (both
# glibc, built by build-linux-remote). Musl builds are disabled for now.
# build-linux stays on ubuntu-24.04 (desktop AppImage bundling needs the
# wxWidgets 3.2 runtime, which only noble's default repos ship) and no longer
# builds/stages the Linux remote tarball. Non-linux remote tarballs (darwin,
# windows) are unchanged (genesis_remote_darwin_arm64.tar.xz,
# genesis_remote_windows_x64.tar.xz).
#
# Triggers: tag push `v*` → all platforms + release (created as a draft,
# published as the FINAL step after all artifacts are uploaded); workflow_dispatch
# → `target`, publish only when publish_release (tag required). Always upload-artifact.
#
# Version derivation: v1.2.3 → 1.2.3 (release name; also the version source for
# the latest.json updater manifest generated by publish-release). The release event
# is intentionally NOT listened to — releases are created by pushing a tag, and the
# draft → publish ordering in publish-release guarantees releases/latest never
# resolves to a release lacking assets.

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-22.04
    outputs:
      publish: ${{ steps.meta.outputs.publish }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      release_version: ${{ steps.meta.outputs.release_version }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
      linux_matrix: ${{ steps.linux.outputs.matrix }}
      linux_remote_matrix: ${{ steps.linux-remote.outputs.matrix }}
    steps:
      - name: Resolve build metadata
        id: meta
        env:
          BUILD_TARGET: ${{ inputs.target }}
          EVENT_NAME: ${{ github.event_name }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
          RELEASE_TAG: ${{ inputs.tag || (github.event_name == 'push' && github.ref_name) || '' }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          PUBLISH=false
          if [[ "${EVENT_NAME}" == "push" || "${PUBLISH_RELEASE}" == "true" ]]; then
            PUBLISH=true
          fi
          if [[ "${PUBLISH}" == "true" && -z "${TAG}" ]]; then
            echo "tag is required when publishing a release" >&2
            exit 1
          fi
          if [[ "${EVENT_NAME}" == "push" ]]; then
            TARGET=all
          else
            TARGET="${BUILD_TARGET}"
          fi

          # v1.2.3 → 1.2.3 (release name; also the version source for the latest.json updater manifest)
          VERSION="${TAG#v}"
          PRERELEASE=false
          if [[ -n "${TAG}" && "${TAG}" == *-* ]]; then
            PRERELEASE=true
          fi

          {
            echo "publish=${PUBLISH}"
            echo "release_tag=${TAG}"
            echo "target=${TARGET}"
            echo "release_version=${VERSION}"
            echo "is_prerelease=${PRERELEASE}"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve Linux matrix
        id: linux
        env:
          TARGET: ${{ steps.meta.outputs.target }}
        run: |
          set -euo pipefail

          # Dynamic matrix so unused linux arches never start a runner.
          case "${TARGET}" in
            all|linux-x64)
              LINUX_X64=1 ;;
            *)
              LINUX_X64=0 ;;
          esac
          case "${TARGET}" in
            all|linux-arm64)
              LINUX_ARM64=1 ;;
            *)
              LINUX_ARM64=0 ;;
          esac

          LINUX_MATRIX="$(
            LINUX_X64="${LINUX_X64}" LINUX_ARM64="${LINUX_ARM64}" python3 - <<'PY'
          import json, os
          rows = []
          if os.environ["LINUX_X64"] == "1":
              rows.append({
                  "arch": "x64",
                  "runner": "ubuntu-24.04",
                  "vendor_platform": "linux-x86_64",
                  "rg_target": "x86_64-unknown-linux-musl",
                  "rg_sha256": "1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599",
                  "rust_target": "x86_64-unknown-linux-gnu",
                  "bundles": "deb,rpm,appimage",
                  "portable": True,
                  "image_os": "",
              })
          if os.environ["LINUX_ARM64"] == "1":
              rows.append({
                  "arch": "arm64",
                  "runner": "ubuntu-24.04-arm",
                  "vendor_platform": "linux-arm64",
                  "rg_target": "aarch64-unknown-linux-gnu",
                  "rg_sha256": "2b661c6ef508e902f388e9098d9c4c5aca72c87b55922d94abdba830b4dc885e",
                  "rust_target": "aarch64-unknown-linux-gnu",
                  "bundles": "deb,rpm",
                  "portable": False,
                  "image_os": "ubuntu24",
              })
          print(json.dumps(rows))
          PY
          )"

          {
            echo "matrix<<EOF"
            echo "${LINUX_MATRIX}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve Linux remote matrix
        id: linux-remote
        env:
          TARGET: ${{ steps.meta.outputs.target }}
        run: |
          set -euo pipefail

          # Dynamic matrix so unused linux arches never start a runner.
          # The dedicated genesis_remote glibc build (x64 + arm64) runs on
          # ubuntu-22.04 for a wider glibc (2.35) compatibility range.
          case "${TARGET}" in
            all|linux-x64)
              LINUX_X64=1 ;;
            *)
              LINUX_X64=0 ;;
          esac
          case "${TARGET}" in
            all|linux-arm64)
              LINUX_ARM64=1 ;;
            *)
              LINUX_ARM64=0 ;;
          esac

          LINUX_REMOTE_MATRIX="$(
            LINUX_X64="${LINUX_X64}" LINUX_ARM64="${LINUX_ARM64}" python3 - <<'PY'
          import json, os
          rows = []
          if os.environ["LINUX_X64"] == "1":
              rows.append({
                  "arch": "x64",
                  "runner": "ubuntu-22.04",
                  "vendor_platform": "linux-x86_64",
                  "rg_target": "x86_64-unknown-linux-musl",
                  "rg_sha256": "1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599",
                  "image_os": "",
              })
          if os.environ["LINUX_ARM64"] == "1":
              rows.append({
                  "arch": "arm64",
                  "runner": "ubuntu-22.04-arm",
                  "vendor_platform": "linux-arm64",
                  "rg_target": "aarch64-unknown-linux-gnu",
                  "rg_sha256": "2b661c6ef508e902f388e9098d9c4c5aca72c87b55922d94abdba830b4dc885e",
                  "image_os": "ubuntu22",
              })
          print(json.dumps(rows))
          PY
          )"

          {
            echo "matrix<<EOF"
            echo "${LINUX_REMOTE_MATRIX}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  # ── Linux (x86_64 + ARM64) ─────────────────────────────────────────────
  build-linux:
    name: Linux (${{ matrix.arch }})
    needs: prepare
    if: needs.prepare.outputs.linux_matrix != '[]'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.linux_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Fix ImageOS for ARM runner
        if: matrix.image_os != ''
        run: echo "ImageOS=${{ matrix.image_os }}" >> "$GITHUB_ENV"

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl file \
            libayatana-appindicator3-dev libdbus-1-dev librsvg2-dev \
            libssl-dev libwebkit2gtk-4.1-dev libxdo-dev wget

      - name: Install wxWidgets 3.2 runtime (AppImage bundling)
        if: matrix.arch == 'x64'
        run: |
          set -euo pipefail
          # The genesis_desktop release bundles OTP's wx app (`wx: :load` in the
          # root mix.exs) for the wx-based directory picker. Its NIFs
          # (lib/wx-*/priv/wxe_driver.so, erl_gl.so) link against wxWidgets 3.2
          # sonames that jammy (22.04) does not ship (only wxWidgets 3.0),
          # so the old fix installed them from the wxformbuilder/wxwidgets3.2 PPA.
          # That PPA no longer exists (add-apt-repository fails with
          # "ppa 'wxformbuilder/wxwidgets3.2' not found" — HTTP 404 on launchpad).
          # The runners are now ubuntu-24.04 (noble), which ships wxWidgets 3.2.4
          # in its default repos, so the runtime libs are installed directly with
          # no PPA. linuxdeploy hard-fails on unresolvable NEEDED entries when
          # bundling the AppImage; tauri-bundler hides its stderr, so the CI
          # error is the generic "failed to run linuxdeploy" (full diagnosis in
          # desktop/src-tauri/CONTEXT.md -> Known Issues). Installing the runtime
          # libs lets linuxdeploy bundle the wxWidgets closure INTO the AppImage
          # (self-contained directory picker).
          sudo apt-get install -y libwxbase3.2-1t64 libwxgtk3.2-1t64 libwxgtk-gl3.2-1t64 libwxgtk-webview3.2-1t64 libglu1-mesa
          # Fail fast if the default repos do not provide the sonames the NIFs need.
          ldconfig -p | grep -q 'libwx_baseu-3.2.so.0' || { echo "wxWidgets 3.2 base lib missing after install"; exit 1; }
          ldconfig -p | grep -q 'libwx_gtk3u_core-3.2.so.0' || { echo "wxWidgets 3.2 gtk lib missing after install"; exit 1; }
          ldconfig -p | grep -q 'libGLU.so.1' || { echo "libGLU.so.1 missing after install"; exit 1; }

      - name: Setup Elixir and assets
        uses: ./.github/actions/setup-mix
        with:
          cache-key: linux-${{ matrix.arch }}

      - name: Bundle vendor binaries
        env:
          VENDOR_PLATFORM: ${{ matrix.vendor_platform }}
          RG_TARGET: ${{ matrix.rg_target }}
          RG_SHA256: ${{ matrix.rg_sha256 }}
        run: |
          set -euo pipefail
          VENDOR_DIR="apps/evo_git/priv/vendor/${VENDOR_PLATFORM}"
          DOWNLOAD_DIR=".build/vendor-downloads"
          mkdir -p "${VENDOR_DIR}"
          mkdir -p "${DOWNLOAD_DIR}"
          RG_ARCHIVE="ripgrep-${RIPGREP_VERSION}-${RG_TARGET}.tar.gz"
          curl -fsSL "https://github.com/BurntSushi/ripgrep/releases/download/${RIPGREP_VERSION}/${RG_ARCHIVE}" -o "${DOWNLOAD_DIR}/${RG_ARCHIVE}"
          echo "${RG_SHA256}  ${DOWNLOAD_DIR}/${RG_ARCHIVE}" | sha256sum -c -
          tar -xzf "${DOWNLOAD_DIR}/${RG_ARCHIVE}" -C "${DOWNLOAD_DIR}"
          cp "${DOWNLOAD_DIR}/ripgrep-${RIPGREP_VERSION}-${RG_TARGET}/rg" "${VENDOR_DIR}/rg"
          chmod +x "${VENDOR_DIR}/rg"
          cp "$(which git)" "${VENDOR_DIR}/git"
          chmod +x "${VENDOR_DIR}/git"

      - name: Build Elixir releases
        run: |
          MIX_ENV=prod mix release genesis_desktop --overwrite

      - name: Place desktop release in Tauri resources
        run: |
          set -euo pipefail
          RESOURCE_DIR="desktop/src-tauri/resources/genesis-backend"
          mkdir -p "$(dirname "${RESOURCE_DIR}")"
          rm -rf "${RESOURCE_DIR}"
          cp -a _build/prod/rel/genesis_desktop "${RESOURCE_DIR}"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: desktop/src-tauri -> target
          key: linux-tauri-${{ matrix.arch }}

      - name: Install Tauri CLI
        uses: ./.github/actions/install-tauri-cli
        with:
          version: ${{ env.TAURI_CLI_VERSION }}

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cd desktop/src-tauri
          UPDATER_ARGS=()
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
            echo "no TAURI_SIGNING_PRIVATE_KEY — disabling updater artifacts" >&2
            UPDATER_ARGS=(--config '{"bundle":{"createUpdaterArtifacts":false}}')
          fi
          tauri build --target "${{ matrix.rust_target }}" --bundles "${{ matrix.bundles }}" ${UPDATER_ARGS[@]+"${UPDATER_ARGS[@]}"}

      - name: Stage artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p dist
          BUNDLE_DIR="desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle"
          PREFIX="genesis_desktop_linux_${{ matrix.arch }}"
          mv "${BUNDLE_DIR}/deb/"*.deb "dist/${PREFIX}.deb"
          mv "${BUNDLE_DIR}/rpm/"*.rpm "dist/${PREFIX}.rpm"
          if [[ "${{ matrix.portable }}" == "true" ]]; then
            mv "${BUNDLE_DIR}/appimage/"*.AppImage "dist/${PREFIX}.AppImage"
            tar -czf "dist/${PREFIX}.tar.gz" \
              -C "desktop/src-tauri/target/${{ matrix.rust_target }}/release" genesis-desktop
            UPDATER_PAYLOADS=("${BUNDLE_DIR}/appimage/"*.AppImage.tar.gz)
            if [[ "${#UPDATER_PAYLOADS[@]}" -gt 0 ]]; then
              mv "${UPDATER_PAYLOADS[0]}" "dist/${PREFIX}.AppImage.tar.gz"
              UPDATER_SIGS=("${BUNDLE_DIR}/appimage/"*.AppImage.tar.gz.sig)
              if [[ "${#UPDATER_SIGS[@]}" -gt 0 ]]; then
                mv "${UPDATER_SIGS[0]}" "dist/${PREFIX}.AppImage.tar.gz.sig"
              else
                echo "warning: AppImage updater payload staged without .sig" >&2
              fi
            fi
          fi
          # Minisign-sign every staged desktop artifact that lacks a .sig
          # (key-guarded — skipped with a warning when the key is absent).
          # The dist/genesis_desktop_* glob excludes genesis_remote_* tarballs;
          # files whose tauri auto-emitted .sig was moved into place (the
          # AppImage.tar.gz updater payload) and .sig files themselves are
          # skipped by the guards below.
          if [[ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
            for artifact in dist/genesis_desktop_*; do
              [[ -f "${artifact}" ]] || continue
              [[ "${artifact}" != *.sig && ! -f "${artifact}.sig" ]] || continue
              echo "signing ${artifact}"
              tauri signer sign "${artifact}"
            done
          else
            echo "warning: no TAURI_SIGNING_PRIVATE_KEY — skipping artifact signing" >&2
          fi

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: genesis-linux-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  # ── Linux Remote (glibc, ubuntu-22.04) ──────────────────────────────────
  # Dedicated genesis_remote glibc build producing the default Linux remote
  # tarballs. Runs on ubuntu-22.04 for a wider glibc (2.35) compatibility
  # range than the desktop build's ubuntu-24.04. Musl builds are disabled for
  # now (see .github/workflows/CONTEXT.md → Known issues).
  build-linux-remote:
    name: Linux Remote (${{ matrix.arch }})
    needs: prepare
    if: needs.prepare.outputs.linux_remote_matrix != '[]'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.linux_remote_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Fix ImageOS for ARM runner
        if: matrix.image_os != ''
        run: echo "ImageOS=${{ matrix.image_os }}" >> "$GITHUB_ENV"

      - name: Setup Elixir and assets
        uses: ./.github/actions/setup-mix
        with:
          cache-key: linux-remote-${{ matrix.arch }}

      - name: Bundle vendor binaries
        env:
          VENDOR_PLATFORM: ${{ matrix.vendor_platform }}
          RG_TARGET: ${{ matrix.rg_target }}
          RG_SHA256: ${{ matrix.rg_sha256 }}
        run: |
          set -euo pipefail
          VENDOR_DIR="apps/evo_git/priv/vendor/${VENDOR_PLATFORM}"
          DOWNLOAD_DIR=".build/vendor-downloads"
          mkdir -p "${VENDOR_DIR}"
          mkdir -p "${DOWNLOAD_DIR}"
          RG_ARCHIVE="ripgrep-${RIPGREP_VERSION}-${RG_TARGET}.tar.gz"
          curl -fsSL "https://github.com/BurntSushi/ripgrep/releases/download/${RIPGREP_VERSION}/${RG_ARCHIVE}" -o "${DOWNLOAD_DIR}/${RG_ARCHIVE}"
          echo "${RG_SHA256}  ${DOWNLOAD_DIR}/${RG_ARCHIVE}" | sha256sum -c -
          tar -xzf "${DOWNLOAD_DIR}/${RG_ARCHIVE}" -C "${DOWNLOAD_DIR}"
          cp "${DOWNLOAD_DIR}/ripgrep-${RIPGREP_VERSION}-${RG_TARGET}/rg" "${VENDOR_DIR}/rg"
          chmod +x "${VENDOR_DIR}/rg"
          cp "$(which git)" "${VENDOR_DIR}/git"
          chmod +x "${VENDOR_DIR}/git"

      - name: Build genesis_remote release
        run: |
          MIX_ENV=prod mix release genesis_remote --overwrite

      - name: Stage artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -cJf "dist/genesis_remote_linux_${{ matrix.arch }}.tar.xz" \
            -C _build/prod/rel genesis_remote

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: genesis-linux-remote-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  # ── macOS ARM64 ────────────────────────────────────────────────────────
  build-macos-arm64:
    name: macOS (ARM64)
    needs: prepare
    if: >-
      github.event_name == 'push' ||
      inputs.target == 'all' ||
      inputs.target == 'macos-arm64'
    runs-on: macos-15
    env:
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Elixir and assets
        uses: ./.github/actions/setup-mix
        with:
          cache-key: macos-arm64

      - name: Bundle vendor binaries
        env:
          VENDOR_PLATFORM: macos-arm64
          RG_TARGET: aarch64-apple-darwin
          RG_SHA256: 378e973289176ca0c6054054ee7f631a065874a352bf43f0fa60ef079b6ba715
        run: |
          set -euo pipefail
          VENDOR_DIR="apps/evo_git/priv/vendor/${VENDOR_PLATFORM}"
          DOWNLOAD_DIR=".build/vendor-downloads"
          mkdir -p "${VENDOR_DIR}"
          mkdir -p "${DOWNLOAD_DIR}"
          RG_ARCHIVE="ripgrep-${RIPGREP_VERSION}-${RG_TARGET}.tar.gz"
          curl -fsSL "https://github.com/BurntSushi/ripgrep/releases/download/${RIPGREP_VERSION}/${RG_ARCHIVE}" -o "${DOWNLOAD_DIR}/${RG_ARCHIVE}"
          echo "${RG_SHA256}  ${DOWNLOAD_DIR}/${RG_ARCHIVE}" | shasum -a 256 -c -
          tar -xzf "${DOWNLOAD_DIR}/${RG_ARCHIVE}" -C "${DOWNLOAD_DIR}"
          cp "${DOWNLOAD_DIR}/ripgrep-${RIPGREP_VERSION}-${RG_TARGET}/rg" "${VENDOR_DIR}/rg"
          chmod +x "${VENDOR_DIR}/rg"

      - name: Build Elixir releases
        run: |
          MIX_ENV=prod mix release genesis_desktop --overwrite
          MIX_ENV=prod mix release genesis_remote --overwrite

      - name: Place desktop release in Tauri resources
        run: |
          set -euo pipefail
          RESOURCE_DIR="desktop/src-tauri/resources/genesis-backend"
          mkdir -p "$(dirname "${RESOURCE_DIR}")"
          rm -rf "${RESOURCE_DIR}"
          cp -a _build/prod/rel/genesis_desktop "${RESOURCE_DIR}"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-darwin

      - name: Cache Rust
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: desktop/src-tauri -> target
          key: macos-tauri-aarch64

      - name: Install Tauri CLI
        uses: ./.github/actions/install-tauri-cli
        with:
          version: ${{ env.TAURI_CLI_VERSION }}

      - name: Import Apple Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          : "${APPLE_CERTIFICATE:?APPLE_CERTIFICATE secret is empty}"
          : "${APPLE_CERTIFICATE_PASSWORD:?APPLE_CERTIFICATE_PASSWORD secret is empty}"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "${RUNNER_TEMP}/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "${RUNNER_TEMP}/build.keychain"
          security default-keychain -s "${RUNNER_TEMP}/build.keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "${RUNNER_TEMP}/build.keychain"
          security set-keychain-settings -t 3600 -u "${RUNNER_TEMP}/build.keychain"
          security import "${RUNNER_TEMP}/certificate.p12" \
            -k "${RUNNER_TEMP}/build.keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" \
            "${RUNNER_TEMP}/build.keychain"
          security find-identity -v -p codesigning "${RUNNER_TEMP}/build.keychain"
          rm -f "${RUNNER_TEMP}/certificate.p12"

      - name: Write App Store Connect API key
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          : "${APPLE_API_KEY:?APPLE_API_KEY secret is empty}"
          : "${APPLE_API_KEY_P8_BASE64:?APPLE_API_KEY_P8_BASE64 secret is empty}"
          KEY_PATH="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "${KEY_PATH}"
          chmod 600 "${KEY_PATH}"
          echo "APPLE_API_KEY_PATH=${KEY_PATH}" >> "$GITHUB_ENV"

      - name: Codesign nested Elixir/ERTS Mach-O binaries
        run: |
          set -euo pipefail
          : "${APPLE_SIGNING_IDENTITY:?APPLE_SIGNING_IDENTITY secret is empty}"
          ./desktop/scripts/sign-macos-nested.sh \
            desktop/src-tauri/resources/genesis-backend

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${APPLE_SIGNING_IDENTITY:?}"
          : "${APPLE_API_ISSUER:?APPLE_API_ISSUER secret is empty}"
          : "${APPLE_API_KEY:?}"
          : "${APPLE_API_KEY_PATH:?}"
          cd desktop/src-tauri
          UPDATER_ARGS=()
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
            echo "no TAURI_SIGNING_PRIVATE_KEY — disabling updater artifacts" >&2
            UPDATER_ARGS=(--config '{"bundle":{"createUpdaterArtifacts":false}}')
          fi
          tauri build --target aarch64-apple-darwin --bundles app,dmg ${UPDATER_ARGS[@]+"${UPDATER_ARGS[@]}"}

      - name: Notarize and verify macOS artifacts
        run: |
          set -euo pipefail
          shopt -s nullglob
          BUNDLE_DIR="desktop/src-tauri/target/aarch64-apple-darwin/release/bundle"
          APP_BUNDLES=("${BUNDLE_DIR}/macos/"*.app)
          DMG_BUNDLES=("${BUNDLE_DIR}/dmg/"*.dmg)
          [[ "${#APP_BUNDLES[@]}" -eq 1 ]] || {
            echo "expected one application bundle, found ${#APP_BUNDLES[@]}" >&2
            exit 1
          }
          [[ "${#DMG_BUNDLES[@]}" -eq 1 ]] || {
            echo "expected one DMG, found ${#DMG_BUNDLES[@]}" >&2
            exit 1
          }
          ./desktop/scripts/notarize-macos-dmg.sh "${DMG_BUNDLES[0]}"
          # The app.zip is both the notarization submission vehicle and the
          # distribution artifact — it stays in dist/ for upload.
          mkdir -p dist
          ditto -c -k --keepParent "${APP_BUNDLES[0]}" \
            "dist/genesis_desktop_darwin_arm64.app.zip"
          xcrun notarytool submit "dist/genesis_desktop_darwin_arm64.app.zip" \
            --issuer "${APPLE_API_ISSUER}" \
            --key-id "${APPLE_API_KEY}" \
            --key "${APPLE_API_KEY_PATH}" \
            --wait
          xcrun stapler staple "${APP_BUNDLES[0]}"
          ./desktop/scripts/verify-macos-artifacts.sh \
            "${APP_BUNDLES[0]}" "${DMG_BUNDLES[0]}"

      - name: Stage artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          BUNDLE_DIR="desktop/src-tauri/target/aarch64-apple-darwin/release/bundle"
          APP_BUNDLES=("${BUNDLE_DIR}/macos/"*.app)
          DMG_BUNDLES=("${BUNDLE_DIR}/dmg/"*.dmg)
          [[ "${#APP_BUNDLES[@]}" -eq 1 ]] || {
            echo "expected one application bundle, found ${#APP_BUNDLES[@]}" >&2
            exit 1
          }
          [[ "${#DMG_BUNDLES[@]}" -eq 1 ]] || {
            echo "expected one DMG, found ${#DMG_BUNDLES[@]}" >&2
            exit 1
          }
          mkdir -p dist
          mv "${DMG_BUNDLES[0]}" "dist/genesis_desktop_darwin_arm64.dmg"
          tar -cJf "dist/genesis_remote_darwin_arm64.tar.xz" \
            -C _build/prod/rel genesis_remote
          if [[ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
            # Re-create the updater payload from the NOW-STAPLED app — tauri's
            # build-time payload predates notarization and is discarded.
            APP_NAME="$(basename "${APP_BUNDLES[0]}")"
            tar -czf "dist/genesis_desktop_darwin_arm64.app.tar.gz" \
              -C "${BUNDLE_DIR}/macos" "${APP_NAME}"
            tauri signer sign "dist/genesis_desktop_darwin_arm64.app.tar.gz"
            # Minisign-sign the remaining staged desktop artifacts that lack a
            # .sig (the .dmg and .app.zip). The .app.tar.gz just signed above
            # is skipped by the -f .sig guard; genesis_remote_* tarballs are
            # excluded by the dist/genesis_desktop_* glob.
            for artifact in dist/genesis_desktop_*; do
              [[ -f "${artifact}" ]] || continue
              [[ "${artifact}" != *.sig && ! -f "${artifact}.sig" ]] || continue
              echo "signing ${artifact}"
              tauri signer sign "${artifact}"
            done
          else
            echo "warning: no TAURI_SIGNING_PRIVATE_KEY — skipping updater payload and artifact signing" >&2
          fi

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: genesis-darwin-arm64
          path: dist/
          if-no-files-found: error

      - name: Remove Apple signing credentials
        if: always()
        run: |
          set -euo pipefail
          if [[ -n "${APPLE_API_KEY_PATH:-}" ]]; then
            rm -f "${APPLE_API_KEY_PATH}"
          fi
          rm -f "${RUNNER_TEMP}/certificate.p12"
          security delete-keychain "${RUNNER_TEMP}/build.keychain" 2>/dev/null || true

  # ── Windows x86_64 ─────────────────────────────────────────────────────
  build-windows-x64:
    name: Windows (x86_64)
    needs: prepare
    if: >-
      github.event_name == 'push' ||
      inputs.target == 'all' ||
      inputs.target == 'windows-x64'
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Elixir and assets
        uses: ./.github/actions/setup-mix
        with:
          cache-key: windows-x86_64

      - name: Bundle vendor binaries
        env:
          VENDOR_PLATFORM: windows-x64
          RG_TARGET: x86_64-pc-windows-msvc
          RG_SHA256: 124510b94b6baa3380d051fdf4650eaa80a302c876d611e9dba0b2e18d87493a
          MINGIT_SHA256: 04f937e1f0918b17b9be6f2294cb2bb66e96e1d9832d1c298e2de088a1d0e668
        run: |
          set -euo pipefail
          VENDOR_DIR="apps/evo_git/priv/vendor/${VENDOR_PLATFORM}"
          DOWNLOAD_DIR=".build/vendor-downloads"
          mkdir -p "${VENDOR_DIR}"
          mkdir -p "${DOWNLOAD_DIR}"
          RG_ARCHIVE="ripgrep-${RIPGREP_VERSION}-${RG_TARGET}.zip"
          curl -fsSL "https://github.com/BurntSushi/ripgrep/releases/download/${RIPGREP_VERSION}/${RG_ARCHIVE}" -o "${DOWNLOAD_DIR}/${RG_ARCHIVE}"
          echo "${RG_SHA256}  ${DOWNLOAD_DIR}/${RG_ARCHIVE}" | sha256sum -c -
          unzip -o "${DOWNLOAD_DIR}/${RG_ARCHIVE}" -d "${DOWNLOAD_DIR}/rg-extract"
          cp "${DOWNLOAD_DIR}/rg-extract/ripgrep-${RIPGREP_VERSION}-${RG_TARGET}/rg.exe" "${VENDOR_DIR}/rg.exe"
          MINGIT_VERSION_CLEAN="${MINGIT_VERSION%.windows.*}"
          MINGIT_ARCHIVE="MinGit-${MINGIT_VERSION_CLEAN}-64-bit.zip"
          MINGIT_URL="https://github.com/git-for-windows/git/releases/download/v${MINGIT_VERSION}/${MINGIT_ARCHIVE}"
          curl -fsSL "${MINGIT_URL}" -o "${DOWNLOAD_DIR}/${MINGIT_ARCHIVE}"
          echo "${MINGIT_SHA256}  ${DOWNLOAD_DIR}/${MINGIT_ARCHIVE}" | sha256sum -c -
          unzip -o "${DOWNLOAD_DIR}/${MINGIT_ARCHIVE}" -d "${VENDOR_DIR}/mingit"

      - name: Build Elixir releases
        run: |
          MIX_ENV=prod mix release genesis_desktop --overwrite
          MIX_ENV=prod mix release genesis_remote --overwrite

      - name: Place desktop release in Tauri resources
        shell: pwsh
        run: |
          $resourceDir = "desktop/src-tauri/resources/genesis-backend"
          $resourceParent = Split-Path -Parent $resourceDir
          New-Item -ItemType Directory -Force -Path $resourceParent | Out-Null
          if (Test-Path $resourceDir) { Remove-Item -Recurse -Force $resourceDir }
          # robocopy avoids MSYS2 cp -a treating extension-less ERTS bins as .exe
          # (File exists). Exit 0–7 = success; 8+ = failure.
          $PSNativeCommandErrorActionPreference = $false
          robocopy "_build/prod/rel/genesis_desktop" $resourceDir /E /NFL /NDL /NJH /NJS /NP
          $rc = $LASTEXITCODE
          if ($rc -ge 8) {
            Write-Error "robocopy failed with exit code $rc"
            exit 1
          }
          exit 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: desktop/src-tauri -> target
          key: windows-tauri-x86_64

      - name: Install Tauri CLI
        uses: ./.github/actions/install-tauri-cli
        with:
          version: ${{ env.TAURI_CLI_VERSION }}

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cd desktop/src-tauri
          UPDATER_ARGS=()
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
            echo "no TAURI_SIGNING_PRIVATE_KEY — disabling updater artifacts" >&2
            UPDATER_ARGS=(--config '{"bundle":{"createUpdaterArtifacts":false}}')
          fi
          tauri build --target x86_64-pc-windows-msvc ${UPDATER_ARGS[@]+"${UPDATER_ARGS[@]}"}

      - name: Stage artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p dist
          BUNDLE_DIR="desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle"
          mv "${BUNDLE_DIR}/msi/"*.msi "dist/genesis_desktop_windows_x64.msi"
          mv "${BUNDLE_DIR}/nsis/"*.exe "dist/genesis_desktop_windows_x64.exe"
          # The NSIS installer IS the updater payload — only its .sig is extra.
          # The .msi.sig in bundle/msi is deliberately NOT staged (MSI is
          # excluded from the updater feed).
          NSIS_SIGS=("${BUNDLE_DIR}/nsis/"*.exe.sig)
          if [[ "${#NSIS_SIGS[@]}" -gt 0 ]]; then
            mv "${NSIS_SIGS[0]}" "dist/genesis_desktop_windows_x64.exe.sig"
          fi
          tar -cJf "dist/genesis_remote_windows_x64.tar.xz" \
            -C _build/prod/rel genesis_remote
          # Minisign-sign every staged desktop artifact that lacks a .sig
          # (key-guarded — skipped with a warning when the key is absent).
          # This signs the .msi; the .exe's tauri auto-emitted .sig was moved
          # into place above and is skipped by the -f .sig guard;
          # genesis_remote_* tarballs are excluded by the glob.
          if [[ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
            for artifact in dist/genesis_desktop_*; do
              [[ -f "${artifact}" ]] || continue
              [[ "${artifact}" != *.sig && ! -f "${artifact}.sig" ]] || continue
              echo "signing ${artifact}"
              tauri signer sign "${artifact}"
            done
          else
            echo "warning: no TAURI_SIGNING_PRIVATE_KEY — skipping artifact signing" >&2
          fi

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: genesis-windows-x64
          path: dist/
          if-no-files-found: error

  # ── Publish release (draft → public) ────────────────────────────────────
  # Single writer for GitHub Release assets: uploads everything to a draft,
  # then flips it public with `gh release edit --draft=false` as the FINAL step.
  publish-release:
    name: Publish GitHub Release
    needs:
      - prepare
      - build-linux
      - build-linux-remote
      - build-macos-arm64
      - build-windows-x64
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.prepare.outputs.publish == 'true' &&
      (needs.build-linux.result == 'success' || needs.build-linux.result == 'skipped') &&
      (needs.build-linux-remote.result == 'success' || needs.build-linux-remote.result == 'skipped') &&
      (needs.build-macos-arm64.result == 'success' || needs.build-macos-arm64.result == 'skipped') &&
      (needs.build-windows-x64.result == 'success' || needs.build-windows-x64.result == 'skipped')
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 1

      - name: Download build artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: genesis-*
          path: dist
          merge-multiple: true

      - name: Extract release notes from CHANGELOG.md
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.release_version }}
        run: |
          set -euo pipefail
          # Best-effort: pull the `## [<version>] - <date>` section for this
          # release out of CHANGELOG.md (maintained by `mix changelog`). A
          # missing file or missing section must never fail the release —
          # write an empty release_body.md and warn instead.
          python3 - <<'PY'
          import os, re, sys

          version = os.environ.get("RELEASE_VERSION", "").strip()
          out_path = "release_body.md"

          def warn(msg):
              print(f"warning: {msg}", file=sys.stderr)

          text = ""
          if os.path.exists("CHANGELOG.md"):
              with open("CHANGELOG.md", encoding="utf-8") as f:
                  text = f.read()
          else:
              warn("CHANGELOG.md not found — release will publish without a body (did the maintainer run `mix changelog`?)")

          section = ""
          if version and text:
              heading = re.compile(rf"^## \[{re.escape(version)}\][ \t]*", re.MULTILINE)
              m = heading.search(text)
              if m:
                  nxt = re.compile(r"^## ", re.MULTILINE).search(text, m.end())
                  end = nxt.start() if nxt else len(text)
                  section = text[m.start():end].strip()
              else:
                  warn(f"no CHANGELOG.md section for version {version} — release will publish without a body (did the maintainer run `mix changelog`?)")
          elif not version:
              warn("empty release version — release will publish without a body")

          with open(out_path, "w", encoding="utf-8") as f:
              if section:
                  f.write(section + "\n")
          if section:
              print(f"extracted CHANGELOG.md section for {version} ({len(section)} chars) -> {out_path}")
          else:
              print(f"wrote empty {out_path}")
          PY

      - name: Generate updater manifest (latest.json)
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Notes come from the CHANGELOG.md section extracted above
          # (release_body.md — the primary source). The gh api lookup is only
          # a last-resort fallback: when the changelog had no section for
          # this version but a previous run already published a release body.
          RELEASE_NOTES="$(cat release_body.md 2>/dev/null || true)"
          if [[ -z "${RELEASE_NOTES}" ]]; then
            RELEASE_NOTES="$(gh api "repos/${REPO}/releases/tags/${RELEASE_TAG}" -q .body 2>/dev/null || true)"
          fi
          export RELEASE_NOTES
          cd dist
          python3 - <<'PY'
          import datetime, json, os, sys

          tag = os.environ["RELEASE_TAG"]
          repo = os.environ["REPO"]
          version = tag[1:] if tag.startswith("v") else tag
          base_url = f"https://github.com/{repo}/releases/download/{tag}"
          entries = {
              "darwin-aarch64": (
                  "genesis_desktop_darwin_arm64.app.tar.gz",
                  "genesis_desktop_darwin_arm64.app.tar.gz.sig",
              ),
              "linux-x86_64": (
                  "genesis_desktop_linux_x64.AppImage.tar.gz",
                  "genesis_desktop_linux_x64.AppImage.tar.gz.sig",
              ),
              "windows-x86_64": (
                  "genesis_desktop_windows_x64.exe",
                  "genesis_desktop_windows_x64.exe.sig",
              ),
          }
          platforms = {}
          for key, (payload, sig) in entries.items():
              if os.path.exists(payload) and os.path.exists(sig):
                  # The FULL .sig content is a single base64 blob that embeds
                  # the untrusted/trusted comment headers; strip the trailing
                  # newline for clean JSON.
                  signature = open(sig).read().strip()
                  platforms[key] = {
                      "url": f"{base_url}/{payload}",
                      "signature": signature,
                  }
                  print(f"included {key}: {payload}")
          if not platforms:
              print("no signed updater payloads found — latest.json not written")
              sys.exit(0)
          manifest = {
              "version": version,
              "notes": os.environ.get("RELEASE_NOTES", ""),
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": platforms,
          }
          with open("latest.json", "w") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          print(f"wrote latest.json for version {version}")
          PY

      # Draft → publish ordering: the draft is invisible to the public and to
      # releases/latest; the FINAL `gh release edit --draft=false` step only
      # runs after ALL artifacts are uploaded, so releases/latest can never
      # resolve to an asset-less release. Re-runs are idempotent: softprops
      # v3.0.2 overwrites files on an existing release and does not flip its
      # draft/prerelease state; `gh release edit --draft=false` is a no-op on
      # an already-published release. If the tag's release doesn't exist (e.g.
      # manual dispatch with a new tag), softprops creates tag+draft via the
      # API — API-created tags/releases never fire push/release workflow
      # events (GITHUB_TOKEN actions never re-trigger workflows), so there is
      # no loop.
      - name: Create or update draft release and upload artifacts
        uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e # v3
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          name: Genesis ${{ needs.prepare.outputs.release_version }}
          body_path: release_body.md
          prerelease: ${{ needs.prepare.outputs.is_prerelease }}
          files: dist/*
          draft: true
          fail_on_unmatched_files: true

      - name: Publish release (flip draft -> public with all assets attached)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ needs.prepare.outputs.release_tag }}"
          gh release edit "${TAG}" --draft=false --repo "${{ github.repository }}"
          echo "Release ${TAG} is now public with all artifacts attached."
