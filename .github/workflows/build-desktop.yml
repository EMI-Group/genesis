name: Build Desktop App

on:
  release:
    types: [published, prereleased]
  workflow_dispatch:
    inputs:
      target:
        description: "Platform to build"
        required: true
        default: macos-arm64
        type: choice
        options:
          - macos-arm64
          - linux-x64
          - linux-arm64
          - windows-x64
          - all
      publish_release:
        description: "Upload artifacts to a GitHub Release"
        required: true
        default: false
        type: boolean
      tag:
        description: "Release tag (required when publish_release is true), e.g. v0.1.0"
        required: false
        type: string

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref }}-
    ${{ inputs.target || 'release' }}-
    ${{ inputs.tag || github.event.release.tag_name || 'build' }}
  cancel-in-progress: true

env:
  ELIXIR_VERSION: "1.20.2"
  OTP_VERSION: "29"
  RUST_VERSION: "1.97.1"
  TAURI_CLI_VERSION: "2.11.4"
  RIPGREP_VERSION: "15.1.0"
  MINGIT_VERSION: "2.54.0.windows.1"

permissions:
  contents: read

# ── Architecture ────────────────────────────────────────────────────────────
#
# Native builds only (mix release --include_erts + Tauri on the host runner).
# Each job also builds genesis_remote and stages installers under dist/.
#
# Jobs:
#   prepare             publish flag, release tag, linux matrix JSON
#   build-linux         ubuntu-22.04 (+ arm) — matrix: deb, rpm, [AppImage, tarball]
#   build-macos-arm64   macos-15 — dmg, app.zip (signed + notarized)
#   build-windows-x64   windows-2022 — msi, exe (NSIS)
#   publish-release     single writer for GitHub Release assets
#
# Shared steps: .github/actions/setup-mix, .github/actions/install-tauri-cli
#
# macOS secrets: APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
# APPLE_SIGNING_IDENTITY, APPLE_API_ISSUER, APPLE_API_KEY, APPLE_API_KEY_P8_BASE64
# Nested ERTS/NIFs: desktop/scripts/sign-macos-nested.sh
#
# Artifact names: genesis_{desktop|remote}_{platform}_{arch}.{format}
# (unversioned — permanent releases/latest/download/ links; the version comes
# from the release tag and is baked into the app at build time, not the filename)
#
# Triggers: release → all platforms + publish; workflow_dispatch → `target`,
# publish only when publish_release (tag required). Always upload-artifact.

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-22.04
    outputs:
      publish: ${{ steps.meta.outputs.publish }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      linux_matrix: ${{ steps.linux.outputs.matrix }}
    steps:
      - name: Resolve build metadata
        id: meta
        env:
          BUILD_TARGET: ${{ inputs.target }}
          EVENT_NAME: ${{ github.event_name }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG}"
          PUBLISH=false
          if [[ "${EVENT_NAME}" == "release" || "${PUBLISH_RELEASE}" == "true" ]]; then
            PUBLISH=true
          fi
          if [[ "${PUBLISH}" == "true" && -z "${TAG}" ]]; then
            echo "tag is required when publishing a release" >&2
            exit 1
          fi
          if [[ "${EVENT_NAME}" == "release" ]]; then
            TARGET=all
          else
            TARGET="${BUILD_TARGET}"
          fi

          {
            echo "publish=${PUBLISH}"
            echo "release_tag=${TAG}"
            echo "target=${TARGET}"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve Linux matrix
        id: linux
        env:
          TARGET: ${{ steps.meta.outputs.target }}
        run: |
          set -euo pipefail

          # Dynamic matrix so unused linux arches never start a runner.
          case "${TARGET}" in
            all|linux-x64)
              LINUX_X64=1 ;;
            *)
              LINUX_X64=0 ;;
          esac
          case "${TARGET}" in
            all|linux-arm64)
              LINUX_ARM64=1 ;;
            *)
              LINUX_ARM64=0 ;;
          esac

          LINUX_MATRIX="$(
            LINUX_X64="${LINUX_X64}" LINUX_ARM64="${LINUX_ARM64}" python3 - <<'PY'
          import json, os
          rows = []
          if os.environ["LINUX_X64"] == "1":
              rows.append({
                  "arch": "x64",
                  "runner": "ubuntu-22.04",
                  "vendor_platform": "linux-x86_64",
                  "rg_target": "x86_64-unknown-linux-musl",
                  "rg_sha256": "1c9297be4a084eea7ecaedf93eb03d058d6faae29bbc57ecdaf5063921491599",
                  "rust_target": "x86_64-unknown-linux-gnu",
                  "bundles": "deb,rpm,appimage",
                  "portable": True,
                  "image_os": "",
              })
          if os.environ["LINUX_ARM64"] == "1":
              rows.append({
                  "arch": "arm64",
                  "runner": "ubuntu-22.04-arm",
                  "vendor_platform": "linux-arm64",
                  "rg_target": "aarch64-unknown-linux-gnu",
                  "rg_sha256": "2b661c6ef508e902f388e9098d9c4c5aca72c87b55922d94abdba830b4dc885e",
                  "rust_target": "aarch64-unknown-linux-gnu",
                  "bundles": "deb,rpm",
                  "portable": False,
                  "image_os": "ubuntu22",
              })
          print(json.dumps(rows))
          PY
          )"

          {
            echo "matrix<<EOF"
            echo "${LINUX_MATRIX}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  # ── Linux (x86_64 + ARM64) ─────────────────────────────────────────────
  build-linux:
    name: Linux (${{ matrix.arch }})
    needs: prepare
    if: needs.prepare.outputs.linux_matrix != '[]'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.linux_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Fix ImageOS for ARM runner
        if: matrix.image_os != ''
        run: echo "ImageOS=${{ matrix.image_os }}" >> "$GITHUB_ENV"

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl file \
            libayatana-appindicator3-dev libdbus-1-dev librsvg2-dev \
            libssl-dev libwebkit2gtk-4.1-dev libxdo-dev wget

      - name: Setup Elixir and assets
        uses: ./.github/actions/setup-mix
        with:
          cache-key: linux-${{ matrix.arch }}

      - name: Bundle vendor binaries
        env:
          VENDOR_PLATFORM: ${{ matrix.vendor_platform }}
          RG_TARGET: ${{ matrix.rg_target }}
          RG_SHA256: ${{ matrix.rg_sha256 }}
        run: |
          set -euo pipefail
          VENDOR_DIR="apps/evo_git/priv/vendor/${VENDOR_PLATFORM}"
          DOWNLOAD_DIR=".build/vendor-downloads"
          mkdir -p "${VENDOR_DIR}"
          mkdir -p "${DOWNLOAD_DIR}"
          RG_ARCHIVE="ripgrep-${RIPGREP_VERSION}-${RG_TARGET}.tar.gz"
          curl -fsSL "https://github.com/BurntSushi/ripgrep/releases/download/${RIPGREP_VERSION}/${RG_ARCHIVE}" -o "${DOWNLOAD_DIR}/${RG_ARCHIVE}"
          echo "${RG_SHA256}  ${DOWNLOAD_DIR}/${RG_ARCHIVE}" | sha256sum -c -
          tar -xzf "${DOWNLOAD_DIR}/${RG_ARCHIVE}" -C "${DOWNLOAD_DIR}"
          cp "${DOWNLOAD_DIR}/ripgrep-${RIPGREP_VERSION}-${RG_TARGET}/rg" "${VENDOR_DIR}/rg"
          chmod +x "${VENDOR_DIR}/rg"
          cp "$(which git)" "${VENDOR_DIR}/git"
          chmod +x "${VENDOR_DIR}/git"

      - name: Build Elixir releases
        run: |
          MIX_ENV=prod mix release genesis_desktop
          MIX_ENV=prod mix release genesis_remote

      - name: Place desktop release in Tauri resources
        run: |
          set -euo pipefail
          RESOURCE_DIR="desktop/src-tauri/resources/genesis-backend"
          mkdir -p "$(dirname "${RESOURCE_DIR}")"
          rm -rf "${RESOURCE_DIR}"
          cp -a _build/prod/rel/genesis_desktop "${RESOURCE_DIR}"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.rust_target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: desktop/src-tauri -> target
          key: linux-tauri-${{ matrix.arch }}

      - name: Install Tauri CLI
        uses: ./.github/actions/install-tauri-cli
        with:
          version: ${{ env.TAURI_CLI_VERSION }}

      - name: Build Tauri app
        run: |
          cd desktop/src-tauri
          tauri build --target "${{ matrix.rust_target }}" --bundles "${{ matrix.bundles }}"

      - name: Stage artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          BUNDLE_DIR="desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle"
          PREFIX="genesis_desktop_linux_${{ matrix.arch }}"
          mv "${BUNDLE_DIR}/deb/"*.deb "dist/${PREFIX}.deb"
          mv "${BUNDLE_DIR}/rpm/"*.rpm "dist/${PREFIX}.rpm"
          if [[ "${{ matrix.portable }}" == "true" ]]; then
            mv "${BUNDLE_DIR}/appimage/"*.AppImage "dist/${PREFIX}.AppImage"
            tar -czf "dist/${PREFIX}.tar.gz" \
              -C "desktop/src-tauri/target/${{ matrix.rust_target }}/release" genesis-desktop
          fi
          tar -czf "dist/genesis_remote_linux_${{ matrix.arch }}.tar.gz" \
            -C _build/prod/rel genesis_remote

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: genesis-linux-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  # ── macOS ARM64 ────────────────────────────────────────────────────────
  build-macos-arm64:
    name: macOS (ARM64)
    needs: prepare
    if: >-
      github.event_name == 'release' ||
      inputs.target == 'all' ||
      inputs.target == 'macos-arm64'
    runs-on: macos-15
    env:
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Elixir and assets
        uses: ./.github/actions/setup-mix
        with:
          cache-key: macos-arm64

      - name: Bundle vendor binaries
        env:
          VENDOR_PLATFORM: macos-arm64
          RG_TARGET: aarch64-apple-darwin
          RG_SHA256: 378e973289176ca0c6054054ee7f631a065874a352bf43f0fa60ef079b6ba715
        run: |
          set -euo pipefail
          VENDOR_DIR="apps/evo_git/priv/vendor/${VENDOR_PLATFORM}"
          DOWNLOAD_DIR=".build/vendor-downloads"
          mkdir -p "${VENDOR_DIR}"
          mkdir -p "${DOWNLOAD_DIR}"
          RG_ARCHIVE="ripgrep-${RIPGREP_VERSION}-${RG_TARGET}.tar.gz"
          curl -fsSL "https://github.com/BurntSushi/ripgrep/releases/download/${RIPGREP_VERSION}/${RG_ARCHIVE}" -o "${DOWNLOAD_DIR}/${RG_ARCHIVE}"
          echo "${RG_SHA256}  ${DOWNLOAD_DIR}/${RG_ARCHIVE}" | shasum -a 256 -c -
          tar -xzf "${DOWNLOAD_DIR}/${RG_ARCHIVE}" -C "${DOWNLOAD_DIR}"
          cp "${DOWNLOAD_DIR}/ripgrep-${RIPGREP_VERSION}-${RG_TARGET}/rg" "${VENDOR_DIR}/rg"
          chmod +x "${VENDOR_DIR}/rg"

      - name: Build Elixir releases
        run: |
          MIX_ENV=prod mix release genesis_desktop
          MIX_ENV=prod mix release genesis_remote

      - name: Place desktop release in Tauri resources
        run: |
          set -euo pipefail
          RESOURCE_DIR="desktop/src-tauri/resources/genesis-backend"
          mkdir -p "$(dirname "${RESOURCE_DIR}")"
          rm -rf "${RESOURCE_DIR}"
          cp -a _build/prod/rel/genesis_desktop "${RESOURCE_DIR}"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-darwin

      - name: Cache Rust
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: desktop/src-tauri -> target
          key: macos-tauri-aarch64

      - name: Install Tauri CLI
        uses: ./.github/actions/install-tauri-cli
        with:
          version: ${{ env.TAURI_CLI_VERSION }}

      - name: Import Apple Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          : "${APPLE_CERTIFICATE:?APPLE_CERTIFICATE secret is empty}"
          : "${APPLE_CERTIFICATE_PASSWORD:?APPLE_CERTIFICATE_PASSWORD secret is empty}"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "${RUNNER_TEMP}/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "${RUNNER_TEMP}/build.keychain"
          security default-keychain -s "${RUNNER_TEMP}/build.keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "${RUNNER_TEMP}/build.keychain"
          security set-keychain-settings -t 3600 -u "${RUNNER_TEMP}/build.keychain"
          security import "${RUNNER_TEMP}/certificate.p12" \
            -k "${RUNNER_TEMP}/build.keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" \
            "${RUNNER_TEMP}/build.keychain"
          security find-identity -v -p codesigning "${RUNNER_TEMP}/build.keychain"
          rm -f "${RUNNER_TEMP}/certificate.p12"

      - name: Write App Store Connect API key
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          : "${APPLE_API_KEY:?APPLE_API_KEY secret is empty}"
          : "${APPLE_API_KEY_P8_BASE64:?APPLE_API_KEY_P8_BASE64 secret is empty}"
          KEY_PATH="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "${KEY_PATH}"
          chmod 600 "${KEY_PATH}"
          echo "APPLE_API_KEY_PATH=${KEY_PATH}" >> "$GITHUB_ENV"

      - name: Codesign nested Elixir/ERTS Mach-O binaries
        run: |
          set -euo pipefail
          : "${APPLE_SIGNING_IDENTITY:?APPLE_SIGNING_IDENTITY secret is empty}"
          ./desktop/scripts/sign-macos-nested.sh \
            desktop/src-tauri/resources/genesis-backend

      - name: Build Tauri app
        run: |
          set -euo pipefail
          : "${APPLE_SIGNING_IDENTITY:?}"
          : "${APPLE_API_ISSUER:?APPLE_API_ISSUER secret is empty}"
          : "${APPLE_API_KEY:?}"
          : "${APPLE_API_KEY_PATH:?}"
          cd desktop/src-tauri
          tauri build --target aarch64-apple-darwin --bundles app,dmg

      - name: Notarize and verify macOS artifacts
        run: |
          set -euo pipefail
          shopt -s nullglob
          BUNDLE_DIR="desktop/src-tauri/target/aarch64-apple-darwin/release/bundle"
          APP_BUNDLES=("${BUNDLE_DIR}/macos/"*.app)
          DMG_BUNDLES=("${BUNDLE_DIR}/dmg/"*.dmg)
          [[ "${#APP_BUNDLES[@]}" -eq 1 ]] || {
            echo "expected one application bundle, found ${#APP_BUNDLES[@]}" >&2
            exit 1
          }
          [[ "${#DMG_BUNDLES[@]}" -eq 1 ]] || {
            echo "expected one DMG, found ${#DMG_BUNDLES[@]}" >&2
            exit 1
          }
          ./desktop/scripts/notarize-macos-dmg.sh "${DMG_BUNDLES[0]}"
          ./desktop/scripts/verify-macos-artifacts.sh \
            "${APP_BUNDLES[0]}" "${DMG_BUNDLES[0]}"

      - name: Stage artifacts
        run: |
          set -euo pipefail
          shopt -s nullglob
          BUNDLE_DIR="desktop/src-tauri/target/aarch64-apple-darwin/release/bundle"
          APP_BUNDLES=("${BUNDLE_DIR}/macos/"*.app)
          DMG_BUNDLES=("${BUNDLE_DIR}/dmg/"*.dmg)
          [[ "${#APP_BUNDLES[@]}" -eq 1 ]] || {
            echo "expected one application bundle, found ${#APP_BUNDLES[@]}" >&2
            exit 1
          }
          [[ "${#DMG_BUNDLES[@]}" -eq 1 ]] || {
            echo "expected one DMG, found ${#DMG_BUNDLES[@]}" >&2
            exit 1
          }
          mkdir -p dist
          mv "${DMG_BUNDLES[0]}" "dist/genesis_desktop_darwin_arm64.dmg"
          ditto -c -k --keepParent "${APP_BUNDLES[0]}" \
            "dist/genesis_desktop_darwin_arm64.app.zip"
          tar -czf "dist/genesis_remote_darwin_arm64.tar.gz" \
            -C _build/prod/rel genesis_remote

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: genesis-darwin-arm64
          path: dist/
          if-no-files-found: error

      - name: Remove Apple signing credentials
        if: always()
        run: |
          set -euo pipefail
          if [[ -n "${APPLE_API_KEY_PATH:-}" ]]; then
            rm -f "${APPLE_API_KEY_PATH}"
          fi
          rm -f "${RUNNER_TEMP}/certificate.p12"
          security delete-keychain "${RUNNER_TEMP}/build.keychain" 2>/dev/null || true

  # ── Windows x86_64 ─────────────────────────────────────────────────────
  build-windows-x64:
    name: Windows (x86_64)
    needs: prepare
    if: >-
      github.event_name == 'release' ||
      inputs.target == 'all' ||
      inputs.target == 'windows-x64'
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Elixir and assets
        uses: ./.github/actions/setup-mix
        with:
          cache-key: windows-x86_64

      - name: Bundle vendor binaries
        env:
          VENDOR_PLATFORM: windows-x64
          RG_TARGET: x86_64-pc-windows-msvc
          RG_SHA256: 124510b94b6baa3380d051fdf4650eaa80a302c876d611e9dba0b2e18d87493a
          MINGIT_SHA256: 04f937e1f0918b17b9be6f2294cb2bb66e96e1d9832d1c298e2de088a1d0e668
        run: |
          set -euo pipefail
          VENDOR_DIR="apps/evo_git/priv/vendor/${VENDOR_PLATFORM}"
          DOWNLOAD_DIR=".build/vendor-downloads"
          mkdir -p "${VENDOR_DIR}"
          mkdir -p "${DOWNLOAD_DIR}"
          RG_ARCHIVE="ripgrep-${RIPGREP_VERSION}-${RG_TARGET}.zip"
          curl -fsSL "https://github.com/BurntSushi/ripgrep/releases/download/${RIPGREP_VERSION}/${RG_ARCHIVE}" -o "${DOWNLOAD_DIR}/${RG_ARCHIVE}"
          echo "${RG_SHA256}  ${DOWNLOAD_DIR}/${RG_ARCHIVE}" | sha256sum -c -
          unzip -o "${DOWNLOAD_DIR}/${RG_ARCHIVE}" -d "${DOWNLOAD_DIR}/rg-extract"
          cp "${DOWNLOAD_DIR}/rg-extract/ripgrep-${RIPGREP_VERSION}-${RG_TARGET}/rg.exe" "${VENDOR_DIR}/rg.exe"
          MINGIT_VERSION_CLEAN="${MINGIT_VERSION%.windows.*}"
          MINGIT_ARCHIVE="MinGit-${MINGIT_VERSION_CLEAN}-64-bit.zip"
          MINGIT_URL="https://github.com/git-for-windows/git/releases/download/v${MINGIT_VERSION}/${MINGIT_ARCHIVE}"
          curl -fsSL "${MINGIT_URL}" -o "${DOWNLOAD_DIR}/${MINGIT_ARCHIVE}"
          echo "${MINGIT_SHA256}  ${DOWNLOAD_DIR}/${MINGIT_ARCHIVE}" | sha256sum -c -
          unzip -o "${DOWNLOAD_DIR}/${MINGIT_ARCHIVE}" -d "${VENDOR_DIR}/mingit"

      - name: Build Elixir releases
        run: |
          MIX_ENV=prod mix release genesis_desktop
          MIX_ENV=prod mix release genesis_remote

      - name: Place desktop release in Tauri resources
        shell: pwsh
        run: |
          $resourceDir = "desktop/src-tauri/resources/genesis-backend"
          $resourceParent = Split-Path -Parent $resourceDir
          New-Item -ItemType Directory -Force -Path $resourceParent | Out-Null
          if (Test-Path $resourceDir) { Remove-Item -Recurse -Force $resourceDir }
          # robocopy avoids MSYS2 cp -a treating extension-less ERTS bins as .exe
          # (File exists). Exit 0–7 = success; 8+ = failure.
          $PSNativeCommandErrorActionPreference = $false
          robocopy "_build/prod/rel/genesis_desktop" $resourceDir /E /NFL /NDL /NJH /NJS /NP
          $rc = $LASTEXITCODE
          if ($rc -ge 8) {
            Write-Error "robocopy failed with exit code $rc"
            exit 1
          }
          exit 0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: desktop/src-tauri -> target
          key: windows-tauri-x86_64

      - name: Install Tauri CLI
        uses: ./.github/actions/install-tauri-cli
        with:
          version: ${{ env.TAURI_CLI_VERSION }}

      - name: Build Tauri app
        run: |
          cd desktop/src-tauri
          tauri build --target x86_64-pc-windows-msvc

      - name: Stage artifacts
        run: |
          set -euo pipefail
          mkdir -p dist
          BUNDLE_DIR="desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle"
          mv "${BUNDLE_DIR}/msi/"*.msi "dist/genesis_desktop_windows_x64.msi"
          mv "${BUNDLE_DIR}/nsis/"*.exe "dist/genesis_desktop_windows_x64.exe"
          tar -czf "dist/genesis_remote_windows_x64.tar.gz" \
            -C _build/prod/rel genesis_remote

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: genesis-windows-x64
          path: dist/
          if-no-files-found: error

  # ── Publish release ─────────────────────────────────────────────────────
  publish-release:
    name: Publish GitHub Release
    needs:
      - prepare
      - build-linux
      - build-macos-arm64
      - build-windows-x64
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.prepare.outputs.publish == 'true' &&
      (needs.build-linux.result == 'success' || needs.build-linux.result == 'skipped') &&
      (needs.build-macos-arm64.result == 'success' || needs.build-macos-arm64.result == 'skipped') &&
      (needs.build-windows-x64.result == 'success' || needs.build-windows-x64.result == 'skipped')
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          pattern: genesis-*
          path: dist
          merge-multiple: true

      - name: Upload to GitHub release
        uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e # v3
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
