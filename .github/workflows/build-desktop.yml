name: Build Desktop App

on:
  release:
    types: [published, prereleased]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g., v0.1.0)"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ELIXIR_VERSION: "1.20.2"
  OTP_VERSION: "29"
  # Burrito 1.5.0 (pinned in mix.lock) requires exactly Zig 0.15.2; it will
  # hard-fail on any other version. Pin it here so CI doesn't grab the latest.
  ZIG_VERSION: "0.15.2"
  RIPGREP_VERSION: "15.1.0"
  MINGIT_VERSION: "2.54.0.windows.1"

permissions:
  contents: write

jobs:
  # ── Stage 1a: Build all Burrito binaries ────────────────────────────────
  #
  # Single job that builds every Burrito target sequentially on ubuntu-24.04
  # and uploads the resulting sidecar + remote binaries as workflow artifacts.
  #
  # Setup (Elixir, Zig, deps, assets) is done once and shared across all
  # targets.  Burrito builds are fast once _build is compiled, so running
  # them sequentially avoids the 5× overhead of duplicating setup.
  #
  # Rust, Tauri CLI, and webkit2gtk dev libs are NOT needed here — those are
  # only required by the downstream Tauri packaging jobs.
  build-burrito-all:
    name: Burrito (all targets)
    runs-on: ubuntu-24.04

    steps:
      # ── Common setup (once for all targets) ──────────────────────────────
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            unzip \
            p7zip-full

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Cache mix deps
        uses: actions/cache@v4
        with:
          path: deps
          key: mix-deps-linux-x86_64-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-deps-linux-x86_64-

      - name: Cache mix build
        uses: actions/cache@v4
        with:
          path: _build
          key: mix-build-linux-x86_64-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-build-linux-x86_64-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Install Elixir dependencies
        run: mix deps.get

      - name: Build assets
        run: |
          mix assets.setup
          mix assets.deploy

      # ── Target: darwin_arm64 ─────────────────────────────────────────────
      - name: Vendor + Burrito (darwin_arm64)
        env:
          BURRITO_TARGET: darwin_arm64
          VENDOR_PLATFORM: macos-arm64
          RG_TARGET: aarch64-apple-darwin
          RG_EXT: .tar.gz
        run: |
          set -euo pipefail
          # --- ripgrep ---
          VENDOR_DIR="apps/evo_git/priv/vendor/${VENDOR_PLATFORM}"
          mkdir -p "${VENDOR_DIR}"
          RG_ARCHIVE="ripgrep-${RIPGREP_VERSION}-${RG_TARGET}${RG_EXT}"
          RG_URL="https://github.com/BurntSushi/ripgrep/releases/download/${RIPGREP_VERSION}/${RG_ARCHIVE}"
          echo "Downloading ${RG_URL}..."
          curl -fsSL "${RG_URL}" -o "/tmp/${RG_ARCHIVE}"
          tar -xzf "/tmp/${RG_ARCHIVE}" -C /tmp
          cp "/tmp/ripgrep-${RIPGREP_VERSION}-${RG_TARGET}/rg" "${VENDOR_DIR}/rg"
          chmod +x "${VENDOR_DIR}/rg"
          echo "ripgrep installed:"
          ls -la "${VENDOR_DIR}/"

          # --- Burrito builds ---
          MIX_ENV=prod mix release genesis_desktop --overwrite
          MIX_ENV=prod mix release genesis_remote --overwrite

      # ── Target: darwin_amd64 ─────────────────────────────────────────────
      - name: Vendor + Burrito (darwin_amd64)
        env:
          BURRITO_TARGET: darwin_amd64
          VENDOR_PLATFORM: macos-x86_64
          RG_TARGET: x86_64-apple-darwin
          RG_EXT: .tar.gz
        run: |
          set -euo pipefail
          # --- ripgrep ---
          VENDOR_DIR="apps/evo_git/priv/vendor/${VENDOR_PLATFORM}"
          mkdir -p "${VENDOR_DIR}"
          RG_ARCHIVE="ripgrep-${RIPGREP_VERSION}-${RG_TARGET}${RG_EXT}"
          RG_URL="https://github.com/BurntSushi/ripgrep/releases/download/${RIPGREP_VERSION}/${RG_ARCHIVE}"
          echo "Downloading ${RG_URL}..."
          curl -fsSL "${RG_URL}" -o "/tmp/${RG_ARCHIVE}"
          tar -xzf "/tmp/${RG_ARCHIVE}" -C /tmp
          cp "/tmp/ripgrep-${RIPGREP_VERSION}-${RG_TARGET}/rg" "${VENDOR_DIR}/rg"
          chmod +x "${VENDOR_DIR}/rg"
          echo "ripgrep installed:"
          ls -la "${VENDOR_DIR}/"

          # --- Burrito builds ---
          MIX_ENV=prod mix release genesis_desktop --overwrite
          MIX_ENV=prod mix release genesis_remote --overwrite

      # ── Target: linux_x64 ────────────────────────────────────────────────
      - name: Vendor + Burrito (linux_x64)
        env:
          BURRITO_TARGET: linux_x64
          VENDOR_PLATFORM: linux-x86_64
          RG_TARGET: x86_64-unknown-linux-musl
          RG_EXT: .tar.gz
        run: |
          set -euo pipefail
          # --- ripgrep ---
          VENDOR_DIR="apps/evo_git/priv/vendor/${VENDOR_PLATFORM}"
          mkdir -p "${VENDOR_DIR}"
          RG_ARCHIVE="ripgrep-${RIPGREP_VERSION}-${RG_TARGET}${RG_EXT}"
          RG_URL="https://github.com/BurntSushi/ripgrep/releases/download/${RIPGREP_VERSION}/${RG_ARCHIVE}"
          echo "Downloading ${RG_URL}..."
          curl -fsSL "${RG_URL}" -o "/tmp/${RG_ARCHIVE}"
          tar -xzf "/tmp/${RG_ARCHIVE}" -C /tmp
          cp "/tmp/ripgrep-${RIPGREP_VERSION}-${RG_TARGET}/rg" "${VENDOR_DIR}/rg"
          chmod +x "${VENDOR_DIR}/rg"
          echo "ripgrep installed:"
          ls -la "${VENDOR_DIR}/"

          # --- system git ---
          cp "$(which git)" "${VENDOR_DIR}/git"
          chmod +x "${VENDOR_DIR}/git"
          echo "Git bundled: $(ls -la "${VENDOR_DIR}/git")"

          # --- Burrito builds ---
          MIX_ENV=prod mix release genesis_desktop --overwrite
          MIX_ENV=prod mix release genesis_remote --overwrite

      # ── Target: linux_arm64 ──────────────────────────────────────────────
      - name: Vendor + Burrito (linux_arm64)
        env:
          BURRITO_TARGET: linux_arm64
          VENDOR_PLATFORM: linux-arm64
          RG_TARGET: aarch64-unknown-linux-gnu
          RG_EXT: .tar.gz
        run: |
          set -euo pipefail
          # --- ripgrep ---
          VENDOR_DIR="apps/evo_git/priv/vendor/${VENDOR_PLATFORM}"
          mkdir -p "${VENDOR_DIR}"
          RG_ARCHIVE="ripgrep-${RIPGREP_VERSION}-${RG_TARGET}${RG_EXT}"
          RG_URL="https://github.com/BurntSushi/ripgrep/releases/download/${RIPGREP_VERSION}/${RG_ARCHIVE}"
          echo "Downloading ${RG_URL}..."
          curl -fsSL "${RG_URL}" -o "/tmp/${RG_ARCHIVE}"
          tar -xzf "/tmp/${RG_ARCHIVE}" -C /tmp
          cp "/tmp/ripgrep-${RIPGREP_VERSION}-${RG_TARGET}/rg" "${VENDOR_DIR}/rg"
          chmod +x "${VENDOR_DIR}/rg"
          echo "ripgrep installed:"
          ls -la "${VENDOR_DIR}/"

          # --- Burrito builds ---
          MIX_ENV=prod mix release genesis_desktop --overwrite
          MIX_ENV=prod mix release genesis_remote --overwrite

      # ── Target: windows_x64 ──────────────────────────────────────────────
      - name: Vendor + Burrito (windows_x64)
        env:
          BURRITO_TARGET: windows_x64
          VENDOR_PLATFORM: windows-x64
          RG_TARGET: x86_64-pc-windows-msvc
          RG_EXT: .zip
        run: |
          set -euo pipefail
          # --- ripgrep (.zip) ---
          VENDOR_DIR="apps/evo_git/priv/vendor/${VENDOR_PLATFORM}"
          mkdir -p "${VENDOR_DIR}"
          RG_ARCHIVE="ripgrep-${RIPGREP_VERSION}-${RG_TARGET}${RG_EXT}"
          RG_URL="https://github.com/BurntSushi/ripgrep/releases/download/${RIPGREP_VERSION}/${RG_ARCHIVE}"
          echo "Downloading ${RG_URL}..."
          curl -fsSL "${RG_URL}" -o "/tmp/${RG_ARCHIVE}"
          unzip -o "/tmp/${RG_ARCHIVE}" -d /tmp/rg-extract
          cp "/tmp/rg-extract/ripgrep-${RIPGREP_VERSION}-${RG_TARGET}/rg.exe" "${VENDOR_DIR}/rg.exe"
          echo "ripgrep installed:"
          ls -la "${VENDOR_DIR}/"

          # --- MinGit ---
          MINGIT_VERSION_CLEAN="${MINGIT_VERSION%.windows.*}"
          MINGIT_ARCHIVE="MinGit-${MINGIT_VERSION_CLEAN}-64-bit.zip"
          MINGIT_URL="https://github.com/git-for-windows/git/releases/download/v${MINGIT_VERSION}/${MINGIT_ARCHIVE}"
          echo "Downloading ${MINGIT_URL}..."
          curl -fsSL "${MINGIT_URL}" -o "/tmp/${MINGIT_ARCHIVE}"
          unzip -o "/tmp/${MINGIT_ARCHIVE}" -d "${VENDOR_DIR}/mingit"
          echo "MinGit installed:"
          ls "${VENDOR_DIR}/mingit/cmd/git.exe"

          # --- Burrito builds ---
          MIX_ENV=prod mix release genesis_desktop --overwrite
          MIX_ENV=prod mix release genesis_remote --overwrite

      # ── Summary ──────────────────────────────────────────────────────────
      - name: Locate Burrito binaries
        run: |
          echo "Contents of burrito_out directory:"
          ls -la burrito_out/ || true

      # ── Upload sidecar & remote artifacts ────────────────────────────────
      - name: Upload sidecar (darwin_arm64)
        uses: actions/upload-artifact@v4
        with:
          name: sidecar-darwin_arm64
          path: burrito_out/genesis_desktop_darwin_arm64
          retention-days: 1

      - name: Upload remote (darwin_arm64)
        uses: actions/upload-artifact@v4
        with:
          name: remote-darwin_arm64
          path: burrito_out/genesis_remote_darwin_arm64
          retention-days: 1

      - name: Upload sidecar (darwin_amd64)
        uses: actions/upload-artifact@v4
        with:
          name: sidecar-darwin_amd64
          path: burrito_out/genesis_desktop_darwin_amd64
          retention-days: 1

      - name: Upload remote (darwin_amd64)
        uses: actions/upload-artifact@v4
        with:
          name: remote-darwin_amd64
          path: burrito_out/genesis_remote_darwin_amd64
          retention-days: 1

      - name: Upload sidecar (linux_x64)
        uses: actions/upload-artifact@v4
        with:
          name: sidecar-linux_x64
          path: burrito_out/genesis_desktop_linux_x64
          retention-days: 1

      - name: Upload remote (linux_x64)
        uses: actions/upload-artifact@v4
        with:
          name: remote-linux_x64
          path: burrito_out/genesis_remote_linux_x64
          retention-days: 1

      - name: Upload sidecar (linux_arm64)
        uses: actions/upload-artifact@v4
        with:
          name: sidecar-linux_arm64
          path: burrito_out/genesis_desktop_linux_arm64
          retention-days: 1

      - name: Upload remote (linux_arm64)
        uses: actions/upload-artifact@v4
        with:
          name: remote-linux_arm64
          path: burrito_out/genesis_remote_linux_arm64
          retention-days: 1

      - name: Upload sidecar (windows_x64)
        uses: actions/upload-artifact@v4
        with:
          name: sidecar-windows_x64
          path: burrito_out/genesis_desktop_windows_x64.exe
          retention-days: 1

      - name: Upload remote (windows_x64)
        uses: actions/upload-artifact@v4
        with:
          name: remote-windows_x64
          path: burrito_out/genesis_remote_windows_x64.exe
          retention-days: 1

  # ── Stage 1b: Linux Tauri bundles ───────────────────────────────────────
  #
  # Downloads the linux_x64 and linux_arm64 sidecars from Stage 1a, builds
  # native (x86_64) and cross-compiled (ARM64) Tauri installers, and uploads
  # everything — Tauri bundles, tarball, and ALL genesis_remote binaries —
  # to the GitHub release in one shot.
  build-tauri-linux:
    name: Tauri Linux (x64 + ARM64 cross)
    needs: build-burrito-all
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux system dependencies
        run: |
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libayatana-appindicator3-dev:arm64 \
            libdbus-1-dev \
            libdbus-1-dev:arm64 \
            librsvg2-dev \
            librsvg2-dev:arm64 \
            libssl-dev \
            libssl-dev:arm64 \
            libwebkit2gtk-4.1-dev \
            libwebkit2gtk-4.1-dev:arm64 \
            libxdo-dev \
            libxdo-dev:arm64 \
            pkg-config-aarch64-linux-gnu \
            wget

      - name: Install ARM64 cross-compiler
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu,aarch64-unknown-linux-gnu

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          key: linux-tauri

      - name: Cache Tauri CLI binary
        id: cache-tauri-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: tauri-cli-Linux-X64-v2

      - name: Install Tauri CLI
        if: steps.cache-tauri-cli.outputs.cache-hit != 'true'
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall tauri-cli --version "^2.0" --no-confirm

      # ── Download sidecar artifacts ──────────────────────────────────────
      - name: Download linux_x64 sidecar
        uses: actions/download-artifact@v4
        with:
          name: sidecar-linux_x64
          path: sidecars/

      - name: Download linux_arm64 sidecar
        uses: actions/download-artifact@v4
        with:
          name: sidecar-linux_arm64
          path: sidecars/

      # ── Place sidecar binaries ──────────────────────────────────────────
      - name: Place sidecar binaries
        run: |
          SIDECAR_DIR="desktop/src-tauri/sidecars"
          mkdir -p "${SIDECAR_DIR}"

          # Linux x86_64
          cp sidecars/genesis_desktop_linux_x64 "${SIDECAR_DIR}/genesis-backend-x86_64-unknown-linux-gnu"
          chmod +x "${SIDECAR_DIR}/genesis-backend-x86_64-unknown-linux-gnu"

          # Linux ARM64
          cp sidecars/genesis_desktop_linux_arm64 "${SIDECAR_DIR}/genesis-backend-aarch64-unknown-linux-gnu"
          chmod +x "${SIDECAR_DIR}/genesis-backend-aarch64-unknown-linux-gnu"

          echo "Sidecar binaries:"
          ls -la "${SIDECAR_DIR}/"

      # ── Build Tauri (Linux x86_64, native) ──────────────────────────────
      - name: Build Tauri (Linux x86_64)
        run: |
          cd desktop/src-tauri
          cargo tauri build --target x86_64-unknown-linux-gnu --bundles rpm,appimage

      # ── Build Tauri (Linux ARM64, cross-compile) ────────────────────────
      - name: Build Tauri (Linux ARM64, cross-compile)
        env:
          PKG_CONFIG_ALLOW_CROSS: "1"
          PKG_CONFIG_PATH: "/usr/lib/aarch64-linux-gnu/pkgconfig"
        run: |
          cd desktop/src-tauri
          cargo tauri build --target aarch64-unknown-linux-gnu --bundles rpm

      # ── Create tarball (portable Linux x86_64 archive) ───────────────────
      - name: Create tarball
        run: |
          cd desktop/src-tauri/target/x86_64-unknown-linux-gnu/release
          tar -czf /tmp/genesis-desktop-x86_64-unknown-linux-gnu.tar.gz genesis-desktop
          echo "Tarball created:"
          ls -la /tmp/genesis-desktop-*.tar.gz

      # ── Download all genesis_remote artifacts for release upload ─────────
      - name: Download all genesis_remote binaries
        uses: actions/download-artifact@v4
        with:
          pattern: remote-*
          path: remote-binaries/
          merge-multiple: true

      - name: List release assets
        run: |
          echo "=== Tauri bundles ==="
          find desktop/src-tauri/target -type f \( -name "*.rpm" -o -name "*.AppImage" \) 2>/dev/null || true
          echo "=== Tarball ==="
          ls -la /tmp/genesis-desktop-*.tar.gz 2>/dev/null || true
          echo "=== Remote binaries ==="
          ls -la remote-binaries/ 2>/dev/null || true

      # ── Upload everything to GitHub release ─────────────────────────────
      - name: Upload to GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name || github.event.inputs.tag }}
          files: |
            desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm
            desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/aarch64-unknown-linux-gnu/release/bundle/rpm/*.rpm
            /tmp/genesis-desktop-*.tar.gz
            remote-binaries/*

  # ── Stage 2a: macOS Tauri (ARM64) ───────────────────────────────────────
  #
  # Downloads the darwin_arm64 sidecar from Stage 1, builds the native
  # macOS .dmg / .app bundles, and uploads them to the release.
  # Does NOT need Elixir, Zig, or mix — just Rust + Tauri CLI.
  build-tauri-macos:
    name: Tauri macOS (ARM64)
    needs: build-burrito-all
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download darwin_arm64 sidecar
        uses: actions/download-artifact@v4
        with:
          name: sidecar-darwin_arm64
          path: sidecars/

      - name: Place sidecar binary
        run: |
          SIDECAR_DIR="desktop/src-tauri/sidecars"
          mkdir -p "${SIDECAR_DIR}"
          cp sidecars/genesis_desktop_darwin_arm64 "${SIDECAR_DIR}/genesis-backend-aarch64-apple-darwin"
          chmod +x "${SIDECAR_DIR}/genesis-backend-aarch64-apple-darwin"

          echo "Sidecar binary:"
          ls -la "${SIDECAR_DIR}/"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          key: macos-tauri-aarch64

      - name: Cache Tauri CLI binary
        id: cache-tauri-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: tauri-cli-macOS-ARM64-v2

      - name: Install Tauri CLI
        if: steps.cache-tauri-cli.outputs.cache-hit != 'true'
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall tauri-cli --version "^2.0" --no-confirm

      - name: Build Tauri app
        run: |
          cd desktop/src-tauri
          cargo tauri build --target aarch64-apple-darwin

      - name: Upload to GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name || github.event.inputs.tag }}
          files: |
            desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app

  # ── Stage 2b: Windows Tauri (x86_64) ────────────────────────────────────
  #
  # Downloads the windows_x64 sidecar from Stage 1, builds the native
  # Windows .msi / .exe installers, and uploads them to the release.
  # Does NOT need Elixir, Zig, or mix — just Rust + Tauri CLI.
  build-tauri-windows:
    name: Tauri Windows (x86_64)
    needs: build-burrito-all
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download windows_x64 sidecar
        uses: actions/download-artifact@v4
        with:
          name: sidecar-windows_x64
          path: sidecars/

      - name: Place sidecar binary
        run: |
          SIDECAR_DIR="desktop/src-tauri/sidecars"
          mkdir -p "${SIDECAR_DIR}"
          cp sidecars/genesis_desktop_windows_x64.exe "${SIDECAR_DIR}/genesis-backend-x86_64-pc-windows-msvc.exe"

          echo "Sidecar binary:"
          ls -la "${SIDECAR_DIR}/"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          key: windows-tauri-x86_64

      - name: Cache Tauri CLI binary
        id: cache-tauri-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: tauri-cli-Windows-X64-v2

      - name: Install Tauri CLI
        if: steps.cache-tauri-cli.outputs.cache-hit != 'true'
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall tauri-cli --version "^2.0" --no-confirm

      - name: Build Tauri app
        run: |
          cd desktop/src-tauri
          cargo tauri build --target x86_64-pc-windows-msvc

      - name: Upload to GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name || github.event.inputs.tag }}
          files: |
            desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
