name: Build Desktop App

on:
  release:
    types: [published, prereleased]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g., v0.1.0)"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ELIXIR_VERSION: "1.20.2"
  OTP_VERSION: "29"
  RIPGREP_VERSION: "15.1.0"
  MINGIT_VERSION: "2.54.0.windows.1"

permissions:
  contents: write

# ── Architecture ────────────────────────────────────────────────────────────
#
# Each platform builds its own native Elixir release (mix release --include_erts
# bundles the host ERTS) and then packages it with Tauri.  No cross-compilation
# or third-party wrapper is used — every job runs on a native runner
# for its target platform.
#
# Each job also builds the genesis_remote headless daemon and uploads it as a
# tarball alongside the desktop installers.
#
# Jobs:
#   build-linux-x64     ubuntu-24.04      deb, rpm, AppImage, tarball
#   build-linux-arm64   ubuntu-24.04-arm  deb, rpm
#   build-macos-arm64   macos-14          dmg, app
#   build-windows-x64   windows-2022      msi, exe (NSIS)

jobs:
  # ── Linux x86_64 ────────────────────────────────────────────────────────
  build-linux-x64:
    name: Linux (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Cache mix deps
        uses: actions/cache@v4
        with:
          path: deps
          key: mix-deps-linux-x86_64-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-deps-linux-x86_64-

      - name: Cache mix build
        uses: actions/cache@v4
        with:
          path: _build
          key: mix-build-linux-x86_64-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-build-linux-x86_64-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - name: Install Elixir dependencies
        run: mix deps.get

      - name: Build assets
        run: |
          mix assets.setup
          mix assets.deploy

      - name: Bundle vendor binaries
        env:
          VENDOR_PLATFORM: linux-x86_64
          RG_TARGET: x86_64-unknown-linux-musl
        run: |
          set -euo pipefail
          VENDOR_DIR="apps/evo_git/priv/vendor/${VENDOR_PLATFORM}"
          mkdir -p "${VENDOR_DIR}"
          # --- ripgrep (musl target for a fully-static binary) ---
          RG_ARCHIVE="ripgrep-${RIPGREP_VERSION}-${RG_TARGET}.tar.gz"
          curl -fsSL "https://github.com/BurntSushi/ripgrep/releases/download/${RIPGREP_VERSION}/${RG_ARCHIVE}" -o "/tmp/${RG_ARCHIVE}"
          tar -xzf "/tmp/${RG_ARCHIVE}" -C /tmp
          cp "/tmp/ripgrep-${RIPGREP_VERSION}-${RG_TARGET}/rg" "${VENDOR_DIR}/rg"
          chmod +x "${VENDOR_DIR}/rg"
          # --- system git ---
          cp "$(which git)" "${VENDOR_DIR}/git"
          chmod +x "${VENDOR_DIR}/git"
          echo "Vendor binaries:"
          ls -la "${VENDOR_DIR}/"

      - name: Build Elixir releases
        run: |
          MIX_ENV=prod mix release genesis_desktop
          MIX_ENV=prod mix release genesis_remote

      - name: Place desktop release in Tauri resources
        run: |
          RESOURCE_DIR="desktop/src-tauri/resources/genesis-backend"
          rm -rf "${RESOURCE_DIR}"
          cp -a _build/prod/rel/genesis_desktop "${RESOURCE_DIR}"
          echo "Release directory placed:"
          ls "${RESOURCE_DIR}/"

      - name: Create genesis_remote tarball
        run: |
          tar -czf /tmp/genesis_remote_linux_x64.tar.gz -C _build/prod/rel genesis_remote
          echo "Remote tarball created:"
          ls -la /tmp/genesis_remote_linux_x64.tar.gz

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          key: linux-tauri-x64

      - name: Cache Tauri CLI binary
        id: cache-tauri-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: tauri-cli-Linux-X64-v2

      - name: Install Tauri CLI
        if: steps.cache-tauri-cli.outputs.cache-hit != 'true'
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall tauri-cli --version "^2.0" --no-confirm

      - name: Build Tauri app
        run: |
          cd desktop/src-tauri
          cargo tauri build --target x86_64-unknown-linux-gnu --bundles deb,rpm,appimage

      - name: Create portable tarball
        run: |
          cd desktop/src-tauri/target/x86_64-unknown-linux-gnu/release
          tar -czf /tmp/genesis_desktop_linux_x64.tar.gz genesis-desktop
          echo "Tarball created:"
          ls -la /tmp/genesis_desktop_linux_x64.tar.gz

      - name: Upload to GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name || github.event.inputs.tag }}
          files: |
            desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
            desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm
            desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
            /tmp/genesis_desktop_linux_x64.tar.gz
            /tmp/genesis_remote_linux_x64.tar.gz

  # ── Linux ARM64 ────────────────────────────────────────────────────────
  build-linux-arm64:
    name: Linux (ARM64)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # GitHub-hosted ARM runners report an ImageOS value that setup-beam does
      # not recognise.  Override it to the base value before setup-beam runs.
      - name: Fix ImageOS for ARM runner
        run: echo "ImageOS=ubuntu24" >> $GITHUB_ENV

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Cache mix deps
        uses: actions/cache@v4
        with:
          path: deps
          key: mix-deps-linux-arm64-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-deps-linux-arm64-

      - name: Cache mix build
        uses: actions/cache@v4
        with:
          path: _build
          key: mix-build-linux-arm64-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-build-linux-arm64-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - name: Install Elixir dependencies
        run: mix deps.get

      - name: Build assets
        run: |
          mix assets.setup
          mix assets.deploy

      - name: Bundle vendor binaries
        env:
          VENDOR_PLATFORM: linux-arm64
          RG_TARGET: aarch64-unknown-linux-gnu
        run: |
          set -euo pipefail
          VENDOR_DIR="apps/evo_git/priv/vendor/${VENDOR_PLATFORM}"
          mkdir -p "${VENDOR_DIR}"
          # --- ripgrep ---
          RG_ARCHIVE="ripgrep-${RIPGREP_VERSION}-${RG_TARGET}.tar.gz"
          curl -fsSL "https://github.com/BurntSushi/ripgrep/releases/download/${RIPGREP_VERSION}/${RG_ARCHIVE}" -o "/tmp/${RG_ARCHIVE}"
          tar -xzf "/tmp/${RG_ARCHIVE}" -C /tmp
          cp "/tmp/ripgrep-${RIPGREP_VERSION}-${RG_TARGET}/rg" "${VENDOR_DIR}/rg"
          chmod +x "${VENDOR_DIR}/rg"
          # --- system git ---
          cp "$(which git)" "${VENDOR_DIR}/git"
          chmod +x "${VENDOR_DIR}/git"
          echo "Vendor binaries:"
          ls -la "${VENDOR_DIR}/"

      - name: Build Elixir releases
        run: |
          MIX_ENV=prod mix release genesis_desktop
          MIX_ENV=prod mix release genesis_remote

      - name: Place desktop release in Tauri resources
        run: |
          RESOURCE_DIR="desktop/src-tauri/resources/genesis-backend"
          rm -rf "${RESOURCE_DIR}"
          cp -a _build/prod/rel/genesis_desktop "${RESOURCE_DIR}"

      - name: Create genesis_remote tarball
        run: |
          tar -czf /tmp/genesis_remote_linux_arm64.tar.gz -C _build/prod/rel genesis_remote

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          key: linux-tauri-arm64

      - name: Cache Tauri CLI binary
        id: cache-tauri-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: tauri-cli-Linux-ARM64-v2

      - name: Install Tauri CLI
        if: steps.cache-tauri-cli.outputs.cache-hit != 'true'
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall tauri-cli --version "^2.0" --no-confirm

      - name: Build Tauri app
        run: |
          cd desktop/src-tauri
          cargo tauri build --target aarch64-unknown-linux-gnu --bundles deb,rpm

      - name: Upload to GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name || github.event.inputs.tag }}
          files: |
            desktop/src-tauri/target/aarch64-unknown-linux-gnu/release/bundle/deb/*.deb
            desktop/src-tauri/target/aarch64-unknown-linux-gnu/release/bundle/rpm/*.rpm
            /tmp/genesis_remote_linux_arm64.tar.gz

  # ── macOS ARM64 ────────────────────────────────────────────────────────
  build-macos-arm64:
    name: macOS (ARM64)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Cache mix deps
        uses: actions/cache@v4
        with:
          path: deps
          key: mix-deps-macos-arm64-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-deps-macos-arm64-

      - name: Cache mix build
        uses: actions/cache@v4
        with:
          path: _build
          key: mix-build-macos-arm64-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-build-macos-arm64-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - name: Install Elixir dependencies
        run: mix deps.get

      - name: Build assets
        run: |
          mix assets.setup
          mix assets.deploy

      - name: Bundle vendor binaries
        env:
          VENDOR_PLATFORM: macos-arm64
          RG_TARGET: aarch64-apple-darwin
        run: |
          set -euo pipefail
          VENDOR_DIR="apps/evo_git/priv/vendor/${VENDOR_PLATFORM}"
          mkdir -p "${VENDOR_DIR}"
          # --- ripgrep ---
          RG_ARCHIVE="ripgrep-${RIPGREP_VERSION}-${RG_TARGET}.tar.gz"
          curl -fsSL "https://github.com/BurntSushi/ripgrep/releases/download/${RIPGREP_VERSION}/${RG_ARCHIVE}" -o "/tmp/${RG_ARCHIVE}"
          tar -xzf "/tmp/${RG_ARCHIVE}" -C /tmp
          cp "/tmp/ripgrep-${RIPGREP_VERSION}-${RG_TARGET}/rg" "${VENDOR_DIR}/rg"
          chmod +x "${VENDOR_DIR}/rg"
          echo "Vendor binaries:"
          ls -la "${VENDOR_DIR}/"

      - name: Build Elixir releases
        run: |
          MIX_ENV=prod mix release genesis_desktop
          MIX_ENV=prod mix release genesis_remote

      - name: Place desktop release in Tauri resources
        run: |
          RESOURCE_DIR="desktop/src-tauri/resources/genesis-backend"
          rm -rf "${RESOURCE_DIR}"
          cp -a _build/prod/rel/genesis_desktop "${RESOURCE_DIR}"

      - name: Create genesis_remote tarball
        run: |
          tar -czf /tmp/genesis_remote_darwin_arm64.tar.gz -C _build/prod/rel genesis_remote

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          key: macos-tauri-aarch64

      - name: Cache Tauri CLI binary
        id: cache-tauri-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: tauri-cli-macOS-ARM64-v2

      - name: Install Tauri CLI
        if: steps.cache-tauri-cli.outputs.cache-hit != 'true'
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall tauri-cli --version "^2.0" --no-confirm

      - name: Build Tauri app
        run: |
          cd desktop/src-tauri
          cargo tauri build --target aarch64-apple-darwin

      - name: Upload to GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name || github.event.inputs.tag }}
          files: |
            desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app
            /tmp/genesis_remote_darwin_arm64.tar.gz

  # ── Windows x86_64 ─────────────────────────────────────────────────────
  build-windows-x64:
    name: Windows (x86_64)
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Cache mix deps
        uses: actions/cache@v4
        with:
          path: deps
          key: mix-deps-windows-x86_64-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-deps-windows-x86_64-

      - name: Cache mix build
        uses: actions/cache@v4
        with:
          path: _build
          key: mix-build-windows-x86_64-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-build-windows-x86_64-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - name: Install Elixir dependencies
        run: mix deps.get

      - name: Build assets
        run: |
          mix assets.setup
          mix assets.deploy

      - name: Bundle vendor binaries
        env:
          VENDOR_PLATFORM: windows-x64
          RG_TARGET: x86_64-pc-windows-msvc
        run: |
          set -euo pipefail
          VENDOR_DIR="apps/evo_git/priv/vendor/${VENDOR_PLATFORM}"
          mkdir -p "${VENDOR_DIR}"
          # --- ripgrep (.zip) ---
          RG_ARCHIVE="ripgrep-${RIPGREP_VERSION}-${RG_TARGET}.zip"
          curl -fsSL "https://github.com/BurntSushi/ripgrep/releases/download/${RIPGREP_VERSION}/${RG_ARCHIVE}" -o "/tmp/${RG_ARCHIVE}"
          unzip -o "/tmp/${RG_ARCHIVE}" -d /tmp/rg-extract
          cp "/tmp/rg-extract/ripgrep-${RIPGREP_VERSION}-${RG_TARGET}/rg.exe" "${VENDOR_DIR}/rg.exe"
          echo "ripgrep installed:"
          ls -la "${VENDOR_DIR}/"
          # --- MinGit ---
          MINGIT_VERSION_CLEAN="${MINGIT_VERSION%.windows.*}"
          MINGIT_ARCHIVE="MinGit-${MINGIT_VERSION_CLEAN}-64-bit.zip"
          MINGIT_URL="https://github.com/git-for-windows/git/releases/download/v${MINGIT_VERSION}/${MINGIT_ARCHIVE}"
          echo "Downloading ${MINGIT_URL}..."
          curl -fsSL "${MINGIT_URL}" -o "/tmp/${MINGIT_ARCHIVE}"
          unzip -o "/tmp/${MINGIT_ARCHIVE}" -d "${VENDOR_DIR}/mingit"
          echo "MinGit installed:"
          ls "${VENDOR_DIR}/mingit/cmd/git.exe"

      - name: Build Elixir releases
        run: |
          MIX_ENV=prod mix release genesis_desktop
          MIX_ENV=prod mix release genesis_remote

      - name: Place desktop release in Tauri resources
        shell: pwsh
        run: |
          $resourceDir = "desktop/src-tauri/resources/genesis-backend"
          if (Test-Path $resourceDir) { Remove-Item -Recurse -Force $resourceDir }
          # Use robocopy instead of MSYS2 cp -a to avoid .exe interpolation
          # issues: MSYS2 treats extension-less files like 'erl' as equivalent
          # to 'erl.exe', causing "File exists" errors when both exist in the
          # ERTS bin/ directory of the release.
          robocopy "_build/prod/rel/genesis_desktop" $resourceDir /E /NFL /NDL /NJH /NJS /NP
          # robocopy uses non-zero exit codes for success (0-7); 8+ = failure
          if ($LASTEXITCODE -ge 8) {
            Write-Error "robocopy failed with exit code $LASTEXITCODE"
            exit 1
          }

      - name: Create genesis_remote tarball
        run: |
          tar -czf /tmp/genesis_remote_windows_x64.tar.gz -C _build/prod/rel genesis_remote

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          key: windows-tauri-x86_64

      - name: Cache Tauri CLI binary
        id: cache-tauri-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: tauri-cli-Windows-X64-v2

      - name: Install Tauri CLI
        if: steps.cache-tauri-cli.outputs.cache-hit != 'true'
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall tauri-cli --version "^2.0" --no-confirm

      - name: Build Tauri app
        run: |
          cd desktop/src-tauri
          cargo tauri build --target x86_64-pc-windows-msvc

      - name: Upload to GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name || github.event.inputs.tag }}
          files: |
            desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            /tmp/genesis_remote_windows_x64.tar.gz
