name: Build Desktop App

on:
  release:
    types: [published, prereleased]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v0.1.0)'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ELIXIR_VERSION: "1.20.1"
  OTP_VERSION: "29"
  RIPGREP_VERSION: "15.1.0"
  MINGIT_VERSION: "2.54.0.windows.1"

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
            rg_target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Restore dependency cache
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile dependencies
        run: mix deps.compile

      - name: Build assets
        run: |
          mix assets.setup
          mix assets.deploy

      - name: Bundle vendor binaries (git, rg)
        run: |
          VENDOR_DIR="apps/evo_git/priv/vendor/macos-${{ matrix.arch }}"
          mkdir -p "${VENDOR_DIR}"

          # Download and extract ripgrep
          RG_ARCHIVE="ripgrep-${RIPGREP_VERSION}-${{ matrix.rg_target }}.tar.gz"
          RG_URL="https://github.com/BurntSushi/ripgrep/releases/download/${RIPGREP_VERSION}/${RG_ARCHIVE}"
          echo "Downloading ${RG_URL}..."
          curl -fsSL "${RG_URL}" -o "/tmp/${RG_ARCHIVE}"
          tar -xzf "/tmp/${RG_ARCHIVE}" -C /tmp
          cp "/tmp/ripgrep-${RIPGREP_VERSION}-${{ matrix.rg_target }}/rg" "${VENDOR_DIR}/rg"

          # Copy system git
          cp "$(which git)" "${VENDOR_DIR}/git"

          # Ensure executables
          chmod +x "${VENDOR_DIR}/"*

          echo "Vendor binaries installed to ${VENDOR_DIR}"
          ls -la "${VENDOR_DIR}/"

      - name: Build release
        run: MIX_ENV=prod mix release evogit

      - name: Package .app bundle
        run: |
          APP_NAME="Genesis"
          STAGING="Genesis.app"

          # Create .app bundle structure
          mkdir -p "${STAGING}/Contents/MacOS"
          mkdir -p "${STAGING}/Contents/Resources"
          mkdir -p "${STAGING}/Contents/Frameworks"

          # Copy release into Contents/release/
          cp -r _build/prod/rel/evogit "${STAGING}/Contents/release"

          # Copy launcher script
          cp rel/overlays/desktop/macos/evogit_launcher "${STAGING}/Contents/MacOS/evogit_launcher"
          chmod +x "${STAGING}/Contents/MacOS/evogit_launcher"

          # Copy Info.plist
          cp rel/overlays/desktop/macos/Info.plist "${STAGING}/Contents/Info.plist"

          # Copy icon as placeholder
          cp apps/evo_dash/priv/static/favicon.ico "${STAGING}/Contents/Resources/favicon.ico" 2>/dev/null || true

          # Zip the .app
          ARCHIVE_NAME="Genesis-macOS-${{ matrix.arch }}.zip"
          zip -r "${ARCHIVE_NAME}" "${STAGING}"

          echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> "$GITHUB_ENV"

      - name: Upload release asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name || github.event.inputs.tag }}
          files: ${{ env.ARCHIVE_NAME }}

  build-windows:
    name: Build Windows (x86_64)
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Restore dependency cache
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile dependencies
        run: mix deps.compile

      - name: Build assets
        run: |
          mix assets.setup
          mix assets.deploy

      - name: Bundle vendor ripgrep (Windows)
        shell: bash
        run: |
          VENDOR_DIR="apps/evo_git/priv/vendor/windows-x64"
          mkdir -p "${VENDOR_DIR}"

          RG_ARCHIVE="ripgrep-${RIPGREP_VERSION}-x86_64-pc-windows-msvc.zip"
          RG_URL="https://github.com/BurntSushi/ripgrep/releases/download/${RIPGREP_VERSION}/${RG_ARCHIVE}"
          echo "Downloading ${RG_URL}..."
          curl -fsSL "${RG_URL}" -o "/tmp/${RG_ARCHIVE}"
          unzip -o "/tmp/${RG_ARCHIVE}" -d /tmp/rg-extract
          cp "/tmp/rg-extract/ripgrep-${RIPGREP_VERSION}-x86_64-pc-windows-msvc/rg.exe" "${VENDOR_DIR}/rg.exe"

          echo "ripgrep installed:"
          ls -la "${VENDOR_DIR}/rg.exe"

      - name: Bundle vendor MinGit (Windows)
        shell: bash
        run: |
          VENDOR_DIR="apps/evo_git/priv/vendor/windows-x64"
          mkdir -p "${VENDOR_DIR}"

          MINGIT_VERSION_CLEAN="${MINGIT_VERSION%.windows.*}"
          MINGIT_ARCHIVE="MinGit-${MINGIT_VERSION_CLEAN}-64-bit.zip"
          MINGIT_URL="https://github.com/git-for-windows/git/releases/download/v${MINGIT_VERSION}/${MINGIT_ARCHIVE}"
          echo "Downloading ${MINGIT_URL}..."
          curl -fsSL "${MINGIT_URL}" -o "/tmp/${MINGIT_ARCHIVE}"
          unzip -o "/tmp/${MINGIT_ARCHIVE}" -d "${VENDOR_DIR}/mingit"

          echo "MinGit installed:"
          ls "${VENDOR_DIR}/mingit/cmd/git.exe"

      - name: Build release
        run: MIX_ENV=prod mix release evogit
        shell: bash

      - name: Package Windows distribution
        shell: bash
        run: |
          STAGING="Genesis-Windows"

          mkdir -p "${STAGING}/release"

          # Use tar piping instead of cp to avoid hardlink/read-only file issues on Windows bash
          tar -cf - -C _build/prod/rel/evogit . | tar -xf - -C "${STAGING}/release"

          # Copy launcher script
          cp rel/overlays/desktop/windows/evogit_launcher.bat "${STAGING}/"

          # Zip
          ARCHIVE_NAME="Genesis-Windows-x64.zip"
          7z a -tzip "${ARCHIVE_NAME}" "${STAGING}"

          echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> "$GITHUB_ENV"

      - name: Upload release asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name || github.event.inputs.tag }}
          files: ${{ env.ARCHIVE_NAME }}
