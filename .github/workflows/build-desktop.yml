name: Build Desktop App

on:
  release:
    types: [published, prereleased]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v0.1.0)'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ELIXIR_VERSION: "1.20.1"
  OTP_VERSION: "29"
  RIPGREP_VERSION: "15.1.0"
  MINGIT_VERSION: "2.54.0.windows.1"

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
            burrito_target: darwin_arm64
            rust_target: aarch64-apple-darwin
            rg_target: aarch64-apple-darwin
            vendor_platform: macos-arm64
          - arch: x64
            runner: macos-13
            burrito_target: darwin_amd64
            rust_target: x86_64-apple-darwin
            rg_target: x86_64-apple-darwin
            vendor_platform: macos-x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Set up Zig
        uses: mlugg/setup-zig@v2

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0"

      - name: Install dependencies
        run: mix deps.get

      - name: Build assets
        run: |
          mix assets.setup
          mix assets.deploy

      - name: Bundle vendor binaries
        run: |
          VENDOR_DIR="apps/evo_git/priv/vendor/${{ matrix.vendor_platform }}"
          mkdir -p "${VENDOR_DIR}"

          # Download and extract ripgrep
          RG_ARCHIVE="ripgrep-${RIPGREP_VERSION}-${{ matrix.rg_target }}.tar.gz"
          RG_URL="https://github.com/BurntSushi/ripgrep/releases/download/${RIPGREP_VERSION}/${RG_ARCHIVE}"
          echo "Downloading ${RG_URL}..."
          curl -fsSL "${RG_URL}" -o "/tmp/${RG_ARCHIVE}"
          tar -xzf "/tmp/${RG_ARCHIVE}" -C /tmp
          cp "/tmp/ripgrep-${RIPGREP_VERSION}-${{ matrix.rg_target }}/rg" "${VENDOR_DIR}/rg"

          # Copy system git
          cp "$(which git)" "${VENDOR_DIR}/git"

          # Ensure executables
          chmod +x "${VENDOR_DIR}/"*

          echo "Vendor binaries installed to ${VENDOR_DIR}"
          ls -la "${VENDOR_DIR}/"

      - name: Build Burrito release
        env:
          BURRITO_TARGET: ${{ matrix.burrito_target }}
        run: MIX_ENV=prod mix release evogit_desktop

      - name: Locate Burrito binary
        run: |
          echo "Contents of burrito_ex output directory:"
          ls -la _build/prod/rel/evogit_desktop/burrito_ex/ || true

      - name: Place sidecar binary
        run: |
          SIDECAR_DIR="desktop/src-tauri/sidecars"
          mkdir -p "${SIDECAR_DIR}"
          # Burrito output is at _build/prod/rel/evogit_desktop/burrito_ex/
          cp _build/prod/rel/evogit_desktop/burrito_ex/evogit_desktop_* "${SIDECAR_DIR}/evogit-backend-${{ matrix.rust_target }}"
          chmod +x "${SIDECAR_DIR}/"*

          echo "Sidecar binaries:"
          ls -la "${SIDECAR_DIR}/"

      - name: Build Tauri app
        run: |
          cd desktop/src-tauri
          cargo tauri build --target ${{ matrix.rust_target }}

      - name: Upload release asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name || github.event.inputs.tag }}
          files: |
            desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/macos/*.app

  build-windows:
    name: Build Windows (x86_64)
    runs-on: windows-2022
    env:
      burrito_target: windows_x64
      rust_target: x86_64-pc-windows-msvc
      rg_target: x86_64-pc-windows-msvc
      vendor_platform: windows-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Set up Zig
        uses: mlugg/setup-zig@v2

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0"

      - name: Install dependencies
        run: mix deps.get

      - name: Build assets
        run: |
          mix assets.setup
          mix assets.deploy

      - name: Bundle vendor ripgrep
        shell: bash
        run: |
          VENDOR_DIR="apps/evo_git/priv/vendor/windows-x64"
          mkdir -p "${VENDOR_DIR}"

          RG_ARCHIVE="ripgrep-${RIPGREP_VERSION}-x86_64-pc-windows-msvc.zip"
          RG_URL="https://github.com/BurntSushi/ripgrep/releases/download/${RIPGREP_VERSION}/${RG_ARCHIVE}"
          echo "Downloading ${RG_URL}..."
          curl -fsSL "${RG_URL}" -o "/tmp/${RG_ARCHIVE}"
          unzip -o "/tmp/${RG_ARCHIVE}" -d /tmp/rg-extract
          cp "/tmp/rg-extract/ripgrep-${RIPGREP_VERSION}-x86_64-pc-windows-msvc/rg.exe" "${VENDOR_DIR}/rg.exe"

          echo "ripgrep installed:"
          ls -la "${VENDOR_DIR}/rg.exe"

      - name: Bundle vendor MinGit
        shell: bash
        run: |
          VENDOR_DIR="apps/evo_git/priv/vendor/windows-x64"
          mkdir -p "${VENDOR_DIR}"

          MINGIT_VERSION_CLEAN="${MINGIT_VERSION%.windows.*}"
          MINGIT_ARCHIVE="MinGit-${MINGIT_VERSION_CLEAN}-64-bit.zip"
          MINGIT_URL="https://github.com/git-for-windows/git/releases/download/v${MINGIT_VERSION}/${MINGIT_ARCHIVE}"
          echo "Downloading ${MINGIT_URL}..."
          curl -fsSL "${MINGIT_URL}" -o "/tmp/${MINGIT_ARCHIVE}"
          unzip -o "/tmp/${MINGIT_ARCHIVE}" -d "${VENDOR_DIR}/mingit"

          echo "MinGit installed:"
          ls "${VENDOR_DIR}/mingit/cmd/git.exe"

      - name: Build Burrito release
        shell: bash
        env:
          BURRITO_TARGET: windows_x64
        run: MIX_ENV=prod mix release evogit_desktop

      - name: Locate Burrito binary
        shell: bash
        run: |
          echo "Contents of burrito_ex output directory:"
          ls -la _build/prod/rel/evogit_desktop/burrito_ex/ || true

      - name: Place sidecar binary
        shell: bash
        run: |
          SIDECAR_DIR="desktop/src-tauri/sidecars"
          mkdir -p "${SIDECAR_DIR}"
          # Burrito output is at _build/prod/rel/evogit_desktop/burrito_ex/
          cp _build/prod/rel/evogit_desktop/burrito_ex/evogit_desktop_* "${SIDECAR_DIR}/evogit-backend-x86_64-pc-windows-msvc.exe"

          echo "Sidecar binaries:"
          ls -la "${SIDECAR_DIR}/"

      - name: Build Tauri app
        shell: bash
        run: |
          cd desktop/src-tauri
          cargo tauri build --target x86_64-pc-windows-msvc

      - name: Upload release asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name || github.event.inputs.tag }}
          files: |
            desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
