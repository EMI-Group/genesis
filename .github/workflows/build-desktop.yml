name: Build Desktop App

on:
  release:
    types: [published, prereleased]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g., v0.1.0)"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ELIXIR_VERSION: "1.20.2"
  OTP_VERSION: "29"
  # Burrito 1.5.0 (pinned in mix.lock) requires exactly Zig 0.15.2; it will
  # hard-fail on any other version. Pin it here so CI doesn't grab the latest.
  ZIG_VERSION: "0.15.2"
  RIPGREP_VERSION: "15.1.0"
  MINGIT_VERSION: "2.54.0.windows.1"

permissions:
  contents: write

jobs:
  build-unix:
    name: Build ${{ matrix.os_label }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_label: macOS
            arch: arm64
            runner: macos-14
            burrito_target: darwin_arm64
            rust_target: aarch64-apple-darwin
            rg_target: aarch64-apple-darwin
            vendor_platform: macos-arm64
            tauri_bundles: ""
          - os_label: Linux
            arch: x64
            runner: ubuntu-24.04
            burrito_target: linux_x64
            rust_target: x86_64-unknown-linux-gnu
            rg_target: x86_64-unknown-linux-musl
            vendor_platform: linux-x86_64
            tauri_bundles: "rpm,appimage"
          - os_label: Linux
            arch: arm64
            runner: ubuntu-24.04-arm
            burrito_target: linux_arm64
            rust_target: aarch64-unknown-linux-gnu
            rg_target: aarch64-unknown-linux-gnu
            vendor_platform: linux-arm64
            # AppImage is excluded on ARM64: appimagetool/linuxdeploy are
            # x86_64-only binaries and the bundling step fails on ARM hosts.
            tauri_bundles: "rpm"
            # The GitHub-hosted ARM partner runner reports ImageOS as
            # 'ubuntu24-arm64', which erlef/setup-beam does not recognize.
            # Override to the base value so setup-beam maps it correctly.
            beam_image_os: ubuntu24
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Linux system dependencies
        if: startsWith(matrix.runner, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev

      - name: Fix ImageOS for ARM partner runners
        # The GitHub-hosted ARM partner runner reports ImageOS as
        # 'ubuntu24-arm64', which erlef/setup-beam does not recognize.
        # Override to the base value so setup-beam can map it correctly.
        if: matrix.beam_image_os != ''
        run: echo "ImageOS=${{ matrix.beam_image_os }}" >> "$GITHUB_ENV"

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Cache mix deps
        uses: actions/cache@v4
        with:
          path: deps
          key: mix-deps-${{ matrix.vendor_platform }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-deps-${{ matrix.vendor_platform }}-

      - name: Cache mix build
        uses: actions/cache@v4
        with:
          path: _build
          key: mix-build-${{ matrix.vendor_platform }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-build-${{ matrix.vendor_platform }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          key: ${{ matrix.rust_target }}

      - name: Cache Tauri CLI binary
        id: cache-tauri-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: tauri-cli-${{ runner.os }}-${{ runner.arch }}-v2

      - name: Install Tauri CLI
        if: steps.cache-tauri-cli.outputs.cache-hit != 'true'
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall tauri-cli --version "^2.0" --no-confirm

      - name: Install dependencies
        run: mix deps.get

      - name: Build assets
        run: |
          mix assets.setup
          mix assets.deploy

      - name: Bundle vendor binaries
        run: |
          VENDOR_DIR="apps/evo_git/priv/vendor/${{ matrix.vendor_platform }}"
          mkdir -p "${VENDOR_DIR}"

          # Download and extract ripgrep
          RG_ARCHIVE="ripgrep-${RIPGREP_VERSION}-${{ matrix.rg_target }}.tar.gz"
          RG_URL="https://github.com/BurntSushi/ripgrep/releases/download/${RIPGREP_VERSION}/${RG_ARCHIVE}"
          echo "Downloading ${RG_URL}..."
          curl -fsSL "${RG_URL}" -o "/tmp/${RG_ARCHIVE}"
          tar -xzf "/tmp/${RG_ARCHIVE}" -C /tmp
          cp "/tmp/ripgrep-${RIPGREP_VERSION}-${{ matrix.rg_target }}/rg" "${VENDOR_DIR}/rg"

          # Copy system git
          cp "$(which git)" "${VENDOR_DIR}/git"

          # Ensure executables
          chmod +x "${VENDOR_DIR}/"*

          echo "Vendor binaries installed to ${VENDOR_DIR}"
          ls -la "${VENDOR_DIR}/"

      - name: Build Burrito release
        env:
          BURRITO_TARGET: ${{ matrix.burrito_target }}
        # --overwrite is required: when _build/ is cache-restored, mix detects
        # an existing assembled release and skips the Burrito.wrap/1 step,
        # leaving burrito_out/ empty. This forces a fresh wrap every run.
        run: MIX_ENV=prod mix release genesis_desktop --overwrite

      - name: Locate Burrito binary
        run: |
          echo "Contents of burrito_out directory:"
          ls -la burrito_out/ || true

      - name: Place sidecar binary
        run: |
          SIDECAR_DIR="desktop/src-tauri/sidecars"
          mkdir -p "${SIDECAR_DIR}"
          cp burrito_out/genesis_desktop_${{ matrix.burrito_target }} "${SIDECAR_DIR}/genesis-backend-${{ matrix.rust_target }}"
          chmod +x "${SIDECAR_DIR}/"*

          echo "Sidecar binaries:"
          ls -la "${SIDECAR_DIR}/"

      - name: Build genesis_remote Burrito release
        # genesis_remote is a headless evo_git-only release for SSH remote
        # development. It is a standalone Burrito binary (no Tauri packaging)
        # uploaded directly to the GitHub release.
        env:
          BURRITO_TARGET: ${{ matrix.burrito_target }}
          # --overwrite is required: when _build/ is cache-restored, mix detects
          # an existing assembled release and skips the Burrito.wrap/1 step,
          # leaving burrito_out/ empty. This forces a fresh wrap every run.
        run: MIX_ENV=prod mix release genesis_remote --overwrite

      - name: Build Tauri app
        run: |
          cd desktop/src-tauri
          if [ -n "${{ matrix.tauri_bundles }}" ]; then
            cargo tauri build --target ${{ matrix.rust_target }} --bundles ${{ matrix.tauri_bundles }}
          else
            cargo tauri build --target ${{ matrix.rust_target }}
          fi

      - name: Create tarball
        # Package the compiled binary as a portable .tar.gz archive for Linux.
        # Tauri does not have a native tar.gz bundle target, so we create it
        # manually from the release binary.
        if: startsWith(matrix.runner, 'ubuntu')
        run: |
          cd desktop/src-tauri/target/${{ matrix.rust_target }}/release
          tar -czf /tmp/genesis-desktop-${{ matrix.rust_target }}.tar.gz genesis-desktop

      - name: Upload release asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name || github.event.inputs.tag }}
          files: |
            desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/macos/*.app
            desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/rpm/*.rpm
            desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/appimage/*.AppImage
            /tmp/genesis-desktop-*.tar.gz
            burrito_out/genesis_remote_${{ matrix.burrito_target }}

      # NOTE on Flatpak: Tauri v2 does not have a native Flatpak bundle target.
      # Producing a Flatpak requires a flatpak-builder manifest (YAML) declaring
      # a Flatpak runtime (e.g. org.freedesktop.Platform//24.08), the application
      # metadata (.desktop file, icon), and build commands. This is significantly
      # more involved than the native Tauri bundlers and typically targets Flathub
      # rather than direct GitHub release downloads. See:
      #   https://v2.tauri.app/distribute/  (no flatpak target listed)
      #   https://docs.flatpak.org/  (flatpak-builder documentation)
      # To add Flatpak support in the future: create a com.genesis.desktop.yaml
      # manifest and add a `flatpak-builder --force-clean build-dir manifest.yaml`
      # step here, then upload the resulting .flatpak bundle.

  build-windows:
    name: Build Windows (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-2022
            rust_target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    env:
      # Both Windows targets use the x64 Burrito release because Erlang/OTP has
      # no native ARM64 Windows build.  On ARM64 machines the x64 ERTS runs via
      # Windows' transparent x86_64 emulation layer, while the Tauri shell
      # itself compiles natively for aarch64.
      burrito_target: windows_x64
      rust_target: ${{ matrix.rust_target }}
      # ripgrep and MinGit are x64 for both architectures; they run through x64
      # emulation on ARM64 Windows.
      rg_target: x86_64-pc-windows-msvc
      vendor_platform: windows-x64
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Fix ImageOS for ARM partner runners
        # The GitHub-hosted ARM partner runner reports ImageOS as
        # 'win11-arm64', which erlef/setup-beam does not recognize.
        # Override to the base value so setup-beam can map it correctly.
        if: matrix.beam_image_os != ''
        shell: bash
        run: echo "ImageOS=${{ matrix.beam_image_os }}" >> "$GITHUB_ENV"

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}

      - name: Cache mix deps
        uses: actions/cache@v4
        with:
          path: deps
          key: mix-deps-windows-${{ matrix.rust_target }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-deps-windows-${{ matrix.rust_target }}-

      - name: Cache mix build
        uses: actions/cache@v4
        with:
          path: _build
          key: mix-build-windows-${{ matrix.rust_target }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-build-windows-${{ matrix.rust_target }}-${{ env.OTP_VERSION }}-${{ env.ELIXIR_VERSION }}-

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
          key: ${{ matrix.rust_target }}

      - name: Cache Tauri CLI binary
        id: cache-tauri-cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: tauri-cli-${{ runner.os }}-${{ runner.arch }}-v2

      - name: Install Tauri CLI
        if: steps.cache-tauri-cli.outputs.cache-hit != 'true'
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall tauri-cli --version "^2.0" --no-confirm

      - name: Install dependencies
        run: mix deps.get

      - name: Build assets
        run: |
          mix assets.setup
          mix assets.deploy

      - name: Bundle vendor ripgrep
        shell: bash
        run: |
          VENDOR_DIR="apps/evo_git/priv/vendor/windows-x64"
          mkdir -p "${VENDOR_DIR}"

          RG_ARCHIVE="ripgrep-${RIPGREP_VERSION}-x86_64-pc-windows-msvc.zip"
          RG_URL="https://github.com/BurntSushi/ripgrep/releases/download/${RIPGREP_VERSION}/${RG_ARCHIVE}"
          echo "Downloading ${RG_URL}..."
          curl -fsSL "${RG_URL}" -o "/tmp/${RG_ARCHIVE}"
          unzip -o "/tmp/${RG_ARCHIVE}" -d /tmp/rg-extract
          cp "/tmp/rg-extract/ripgrep-${RIPGREP_VERSION}-x86_64-pc-windows-msvc/rg.exe" "${VENDOR_DIR}/rg.exe"

          echo "ripgrep installed:"
          ls -la "${VENDOR_DIR}/rg.exe"

      - name: Bundle vendor MinGit
        shell: bash
        run: |
          VENDOR_DIR="apps/evo_git/priv/vendor/windows-x64"
          mkdir -p "${VENDOR_DIR}"

          MINGIT_VERSION_CLEAN="${MINGIT_VERSION%.windows.*}"
          MINGIT_ARCHIVE="MinGit-${MINGIT_VERSION_CLEAN}-64-bit.zip"
          MINGIT_URL="https://github.com/git-for-windows/git/releases/download/v${MINGIT_VERSION}/${MINGIT_ARCHIVE}"
          echo "Downloading ${MINGIT_URL}..."
          curl -fsSL "${MINGIT_URL}" -o "/tmp/${MINGIT_ARCHIVE}"
          unzip -o "/tmp/${MINGIT_ARCHIVE}" -d "${VENDOR_DIR}/mingit"

          echo "MinGit installed:"
          ls "${VENDOR_DIR}/mingit/cmd/git.exe"

      - name: Build Burrito release
        shell: bash
        env:
          BURRITO_TARGET: windows_x64
        # --overwrite is required: when _build/ is cache-restored, mix detects
        # an existing assembled release and skips the Burrito.wrap/1 step,
        # leaving burrito_out/ empty. This forces a fresh wrap every run.
        run: MIX_ENV=prod mix release genesis_desktop --overwrite

      - name: Locate Burrito binary
        shell: bash
        run: |
          echo "Contents of burrito_out directory:"
          ls -la burrito_out/ || true

      - name: Place sidecar binary
        shell: bash
        run: |
          SIDECAR_DIR="desktop/src-tauri/sidecars"
          mkdir -p "${SIDECAR_DIR}"
          cp burrito_out/genesis_desktop_windows_x64.exe "${SIDECAR_DIR}/genesis-backend-${{ matrix.rust_target }}.exe"

          echo "Sidecar binaries:"
          ls -la "${SIDECAR_DIR}/"

      - name: Build genesis_remote Burrito release
        # genesis_remote is a headless evo_git-only release for SSH remote
        # development. It is a standalone Burrito binary (no Tauri packaging)
        # uploaded directly to the GitHub release.
        shell: bash
        env:
          BURRITO_TARGET: windows_x64
          # --overwrite is required: when _build/ is cache-restored, mix detects
          # an existing assembled release and skips the Burrito.wrap/1 step,
          # leaving burrito_out/ empty. This forces a fresh wrap every run.
        run: MIX_ENV=prod mix release genesis_remote --overwrite

      - name: Build Tauri app
        shell: bash
        run: |
          cd desktop/src-tauri
          cargo tauri build --target ${{ matrix.rust_target }}

      - name: Upload release asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name || github.event.inputs.tag }}
          files: |
            desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/msi/*.msi
            desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/nsis/*.exe
            burrito_out/genesis_remote_windows_x64.exe
