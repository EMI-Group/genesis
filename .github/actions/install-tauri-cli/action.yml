name: Install Tauri CLI
description: Cache, install, and verify a pinned tauri-cli version (npm @tauri-apps/cli)

inputs:
  version:
    description: Exact tauri-cli version to install
    required: true

runs:
  using: composite
  steps:
    - name: Cache Tauri CLI
      id: cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ runner.os == 'Windows' && '~\AppData\Roaming\npm' || '~/tauri-cli' }}
        key: tauri-cli-${{ runner.os }}-${{ runner.arch }}-${{ inputs.version }}

    - name: Install Tauri CLI (Linux/macOS)
      if: runner.os != 'Windows' && steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        TAURI_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        npm install -g --prefix "$HOME/tauri-cli" "@tauri-apps/cli@${TAURI_VERSION}" --no-audit --no-fund

    - name: Install Tauri CLI (Windows)
      if: runner.os == 'Windows' && steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        TAURI_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        npm install -g "@tauri-apps/cli@${TAURI_VERSION}" --no-audit --no-fund

    - name: Add Tauri CLI bin to PATH
      if: runner.os != 'Windows'
      shell: bash
      run: echo "$HOME/tauri-cli/bin" >> "$GITHUB_PATH"

    - name: Verify Tauri CLI version
      shell: bash
      env:
        TAURI_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        ACTUAL_VERSION="$(tauri --version)"
        EXPECTED_VERSION="tauri-cli ${TAURI_VERSION}"
        if [[ "${ACTUAL_VERSION}" != "${EXPECTED_VERSION}" ]]; then
          echo "expected ${EXPECTED_VERSION}, found ${ACTUAL_VERSION}" >&2
          exit 1
        fi
