name: Install Tauri CLI
description: Cache, install, and verify a pinned cargo-tauri version

inputs:
  version:
    description: Exact tauri-cli version to install
    required: true

runs:
  using: composite
  steps:
    - name: Cache Tauri CLI binary
      id: cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.cargo/bin/cargo-tauri
          ~/.cargo/bin/cargo-tauri.exe
        key: tauri-cli-${{ runner.os }}-${{ runner.arch }}-${{ inputs.version }}

    - name: Install cargo-binstall
      if: steps.cache.outputs.cache-hit != 'true'
      uses: cargo-bins/cargo-binstall@e00d2c94cc0067b77737821097a62d91c0301baa # v1.21.1
      with:
        version: "1.21.1"

    - name: Install Tauri CLI
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        TAURI_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        cargo binstall tauri-cli \
          --version "=${TAURI_VERSION}" \
          --disable-strategies quick-install \
          --no-confirm

    - name: Verify Tauri CLI version
      shell: bash
      env:
        TAURI_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        ACTUAL_VERSION="$(cargo tauri --version)"
        EXPECTED_VERSION="tauri-cli ${TAURI_VERSION}"
        if [[ "${ACTUAL_VERSION}" != "${EXPECTED_VERSION}" ]]; then
          echo "expected ${EXPECTED_VERSION}, found ${ACTUAL_VERSION}" >&2
          exit 1
        fi
