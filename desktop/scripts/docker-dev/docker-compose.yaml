# Genesis Docker (dev/test only). Keep this file next to the Dockerfile.
# PHX_HOST, PHX_SERVER, and the dev-only SECRET_KEY_BASE default in the image.
#
#   mkdir -p {config,data,workspace}
#   GIT_AUTH_TOKEN="$(gh auth token)" docker compose up --build
#   open http://localhost:9999

services:
  genesis:
    image: genesis:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GENESIS_VERSION: "${GENESIS_VERSION:-v0.9.2}"
        NODE_VERSION: "${NODE_VERSION:-lts-latest}"
        PYTHON_VERSION: "${PYTHON_VERSION:-3.12}"
        RUST_TOOLCHAIN: "${RUST_TOOLCHAIN:-stable}"
      secrets:
        - GIT_AUTH_TOKEN
    # Use the init process supplied by the container runtime.
    init: true
    ports:
      # host:container
      - "9999:9999"
    environment:
      # Phoenix HTTP port (keep in sync with `ports:` above)
      PORT: "9999"

      # Dev/test default is baked into the image. Uncomment to override:
      # SECRET_KEY_BASE: "${SECRET_KEY_BASE}"

      # Default is localhost. Use the hostname or IP that browsers use when
      # accessing Genesis from another machine:
      # PHX_HOST: "genesis.example.test"
    volumes:
      # Genesis config and credentials.
      - ./config:/app/.config/genesis

      # Genesis database and runtime data.
      - ./data:/app/.local/share/genesis

      # Host project(s) for agents (relative to this Compose file).
      - ./workspace:/app/workspace
    restart: unless-stopped

secrets:
  GIT_AUTH_TOKEN:
    environment: GIT_AUTH_TOKEN
