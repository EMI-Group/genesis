<svg xmlns="http://www.w3.org/2000/svg" width="960" height="468" viewBox="0 0 960 468" role="img"><rect width="960" height="468" rx="24" fill="#08090b"/><rect x="1" y="1" width="958" height="466" rx="23" fill="none" stroke="#303136"/><g font-family="Arial, sans-serif"><text x="40" y="52" fill="#f5f5f7" font-size="32" text-anchor="start" font-weight="600">Built for long-running development.</text><text x="40" y="87" fill="#a9aaaf" font-size="22" text-anchor="start" font-weight="400">Three layers, each with one job.</text><rect x="40" y="118" width="880" height="92" rx="14" fill="#121315" stroke="#303136"/><path d="M40 138 V190" stroke="#c8383c" stroke-width="3"/><text x="64" y="157" fill="#c8383c" font-size="18" text-anchor="start" font-weight="600">01</text><text x="108" y="156" fill="#f5f5f7" font-size="25" text-anchor="start" font-weight="600">desktop</text><text x="108" y="184" fill="#a9aaaf" font-size="19" text-anchor="start" font-weight="400">Tauri / Rust</text><text x="385" y="171" fill="#f5f5f7" font-size="22" text-anchor="start" font-weight="400">Start and supervise the backend.</text><path d="M480 212 V227 M475 222 L480 227 L485 222" fill="none" stroke="#77787e" stroke-width="2"/><rect x="40" y="230" width="880" height="92" rx="14" fill="#121315" stroke="#303136"/><path d="M40 250 V302" stroke="#c8383c" stroke-width="3"/><text x="64" y="269" fill="#c8383c" font-size="18" text-anchor="start" font-weight="600">02</text><text x="108" y="268" fill="#f5f5f7" font-size="25" text-anchor="start" font-weight="600">evo_dash</text><text x="108" y="296" fill="#a9aaaf" font-size="19" text-anchor="start" font-weight="400">Phoenix LiveView</text><text x="385" y="283" fill="#f5f5f7" font-size="22" text-anchor="start" font-weight="400">Watch agents, inspect tasks, review diffs.</text><path d="M480 324 V339 M475 334 L480 339 L485 334" fill="none" stroke="#77787e" stroke-width="2"/><rect x="40" y="342" width="880" height="92" rx="14" fill="#121315" stroke="#303136"/><path d="M40 362 V414" stroke="#c8383c" stroke-width="3"/><text x="64" y="381" fill="#c8383c" font-size="18" text-anchor="start" font-weight="600">03</text><text x="108" y="380" fill="#f5f5f7" font-size="25" text-anchor="start" font-weight="600">evo_git</text><text x="108" y="408" fill="#a9aaaf" font-size="19" text-anchor="start" font-weight="400">Elixir / OTP</text><text x="385" y="395" fill="#f5f5f7" font-size="22" text-anchor="start" font-weight="400">Schedule agents and manage Git worktrees.</text></g></svg>