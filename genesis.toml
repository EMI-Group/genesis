# genesis.toml — Genesis project configuration file.
# This file controls per-project settings for Genesis agents, including worktree
# initialization scripts, foreign repository references, and dashboard commands.
# Genesis agents read this file automatically; most users do not need to edit it.

# ─── Worktree Init Script ───────────────────────────────────────────────────
# This script runs automatically after each new git worktree is created. It
# copies dependencies and build artifacts from the source repo into the new
# worktree so builds start with a warm cache (avoiding re-download/recompile).
#
# Environment variables available to the script:
#   SOURCE_REPO_PATH      — main repository checkout (where genesis.toml lives)
#   SOURCE_WORKTREE_PATH  — parent agent's worktree path
#   TARGET_WORKTREE_PATH  — newly created worktree (copy destination)
#
# WARNING: Do NOT modify or remove this section unless you know what you are
# doing. Genesis manages it automatically based on the build system selected
# during project creation. Removing it will cause every new worktree to build
# from scratch (much slower).

[worktree]
script.linux = '''#!/usr/bin/env bash
# Copy Elixir dependencies and build artifacts
# Preserve timestamps so Mix's mtime-based build cache stays warm.
if [ -d "$SOURCE_REPO_PATH/deps" ]; then
  cp -R --preserve=timestamps --reflink=auto "$SOURCE_REPO_PATH/deps" "$TARGET_WORKTREE_PATH/"
fi
if [ -d "$SOURCE_REPO_PATH/_build" ]; then
  cp -R --preserve=timestamps --reflink=auto "$SOURCE_REPO_PATH/_build" "$TARGET_WORKTREE_PATH/"
  # Protocol consolidation is derived from the SOURCE checkout's dep set, but the
  # preserved mtimes make Mix think the copies are current, so a stale
  # consolidated beam (built before a dep added a protocol impl) would be reused
  # silently. Drop it; the next compile rebuilds it from the copied deps.
  rm -rf "$TARGET_WORKTREE_PATH"/_build/*/consolidated "$TARGET_WORKTREE_PATH"/_build/*/lib/*/consolidated
fi
'''
script.macos = '''#!/usr/bin/env bash
# Copy Elixir dependencies and build artifacts
# Preserve timestamps so Mix's mtime-based build cache stays warm.
if [ -d "$SOURCE_REPO_PATH/deps" ]; then
  cp -cRp "$SOURCE_REPO_PATH/deps" "$TARGET_WORKTREE_PATH/"
fi
if [ -d "$SOURCE_REPO_PATH/_build" ]; then
  cp -cRp "$SOURCE_REPO_PATH/_build" "$TARGET_WORKTREE_PATH/"
  # Protocol consolidation is derived from the SOURCE checkout's dep set, but the
  # preserved mtimes make Mix think the copies are current, so a stale
  # consolidated beam (built before a dep added a protocol impl) would be reused
  # silently. Drop it; the next compile rebuilds it from the copied deps.
  rm -rf "$TARGET_WORKTREE_PATH"/_build/*/consolidated "$TARGET_WORKTREE_PATH"/_build/*/lib/*/consolidated
fi
'''
script.windows = '''# Copy Elixir dependencies and build artifacts
if (Test-Path "$env:SOURCE_REPO_PATH/deps") {
    Copy-Item -Recurse -Force "$env:SOURCE_REPO_PATH/deps" "$env:TARGET_WORKTREE_PATH/"
}
if (Test-Path "$env:SOURCE_REPO_PATH/_build") {
    Copy-Item -Recurse -Force "$env:SOURCE_REPO_PATH/_build" "$env:TARGET_WORKTREE_PATH/"
    # Protocol consolidation is derived from the SOURCE checkout's dep set, but the
    # copied beams keep their old mtimes, so Mix would reuse a stale consolidated
    # set. Remove it; the next compile rebuilds it from the copied deps.
    Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "$env:TARGET_WORKTREE_PATH\_build\*\consolidated", "$env:TARGET_WORKTREE_PATH\_build\*\lib\*\consolidated"
}
'''
